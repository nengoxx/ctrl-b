
    <!-- Viewport meta tag for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #222c3e;
        }
        .status-awake {
            color: green;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .status-asleep {
            color: red;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .btn-custom {
            font-size: 1.2rem;
            padding: 0.5rem 0.7rem 0.5rem 0.7rem;
            /* margin: 0.5rem; */
        }
        .header-image {
            display: block;
            margin: 26px auto 0 auto;
            width:100%;
            max-width:600px;
            height: auto;
        }
        @media (max-width: 768px) {
            .status-awake, .status-asleep {
                font-size: 1.5rem;
            }
            /* .btn-custom {
                font-size: 1rem;
                padding: 1rem 1rem;
            } */
        }
        /* Custom styles for input and log */
        .input-group .form-control.rounded-bottom {
            border-bottom-left-radius: 0.25rem;
            border-bottom-right-radius: 0.25rem;
        }
        .input-group .form-control.square-bottom {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }
        #response-log {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            margin-bottom: 30px;
        }
    </style>

    <!-- ##### HEADER IMG ################################################################### -->
    <div class="container">
        <img src="{{ url_for('static', filename='img.png') }}" class="header-image">
    </div>
    
    <!-- ##### COMPUTERS ################################################################### -->
    <div class="container">
        <ul class="list-group">
            {% for computer in computers.values() %}
            <li class="list-group-item list-group-item-dark d-flex justify-content-between align-items-center" id="computer-{{ computer.name }}">
                <span class="status-indicator {% if status[computer.name] %}status-awake{% else %}status-asleep{% endif %}" id="status-{{ computer.name }}">
                    {{ computer.name }}
                </span>
                <div class="btn-group p-2" role="group">
                    <button class="btn btn-dark btn-custom btn-lg" onclick="wakeComputer('{{ computer.name }}')">Wake Up</button>
                    <button class="btn btn-danger btn-custom btn-lg" data-bs-toggle="modal" data-bs-target="#shutdownModal" onclick="setComputerName('{{ computer.name }}')">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>

    <!-- Shutdown Modal -->
    <div class="modal fade" id="shutdownModal" tabindex="-1" aria-labelledby="shutdownModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="shutdownModalLabel">Confirm Shutdown</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to shut down the PC?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmShutdown()">Shutdown</button>
                </div>
            </div>
        </div>
    </div>

   
    <!-- ##### CHAT/COMMAND FORM ################################################################### -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <!-- Chat-like input form -->
                <div class="input-group">
                    <input
                        type="text"
                        id="command-input"
                        class="form-control"
                        placeholder="Enter your instruction..."
                        aria-label="Command Input"
                        onkeydown="handleKeyDown(event)"
                    />
                    <button
                        id="send-button"
                        class="btn btn-dark btn-custom"
                        onclick="handleCommand()"
                    >
                        <b>></b>
                    </button>
                </div>

                <!-- Log of past responses -->
                <div id="response-log" class="list-group">
                    <!-- Responses will be dynamically added here -->
                </div>
            </div>
        </div>
    </div>
