[project]
name = "ctrl-b-dashboard"
# Version is derived from the git tag by hatch-vcs (see [tool.hatch.version]) — never hardcode it.
dynamic = ["version"]
description = "ctrl-b — FastAPI backend for the homelab control panel"
requires-python = ">=3.14"

# Pinned baseline (RESEARCH.md §Backend). Treat as starting pins; bump deliberately.
# Phase 0 only exercises fastapi/uvicorn/pydantic(-settings)/pyyaml/aiosqlite; the rest are
# declared now so later phases (SSH, WOL, agent, voice, utils) add code, not deps.
dependencies = [
    "fastapi==0.138.1",            # 0.137+ raises the Starlette floor to >=1.3.1 (official Python 3.14 support).
                                   # HARD FLOOR >=0.138: prod SPA serving calls `app.frontend()` (D55), added
                                   # in 0.138.0. Downgrading below it breaks the frontend at import, not at test.
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",            # latest stable (2.14 is pre-release only)
    "pydantic-settings==2.14.2",   # 2.14.2 = Dependabot GHSA fix (NestedSecrets symlink read) + 3.14-ready
    "sse-starlette==3.4.5",
    "paramiko==5.0.0",             # 5.0 dropped SHA1/MD5/DSA/GSSAPI — fleet hosts must negotiate modern algos
    "wakeonlan==3.3.0",
    "openai==2.44.0",              # chat.completions is correct for the OpenAI-compatible llama.cpp/OpenRouter endpoints
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.18.17",   # comment/format-preserving YAML writer for UI config edits (Phase 7a)
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "youtube-transcript-api==1.2.4",
    "beautifulsoup4==4.14.3",
    "aiosqlite==0.22.1",
    "cronsim==2.7",                # A3/D49: cron parse + DST-correct next-fire for the automations scheduler. ONE module, ZERO deps, 3.14-tested (R7: APScheduler 4.x is alpha + 3.x has the weekday-0 bug; croniter double-fires across the autumn fold).
    "tzdata==2026.3",              # rides with cronsim: `zoneinfo` needs a tz database, which Windows does not ship (ARCHITECTURE §6 — the code stays OS-agnostic, so the data must too). No-op on Linux/macOS, which have the system one.
    "mcp==1.28.1",                 # exact pin caps the imminent breaking v2 (drops the 3rd stream tuple element)
    "pypdf==6.16.2",               # D68/A8 S4: the ONE new dep of composer attachments (ATTACHMENTS_PLAN §10) — pure-Python PDF text extraction at claim, zero runtime deps of its own (the `crypto` extra is not installed: an encrypted PDF is an extraction failure, not a feature). Exact pin: it parses hostile input.
    "anyio>=4.2",                  # first DIRECT use: session.py's shielded-finally CancelScope (ACA Slice 2 / D38). Floor, not exact: transitive via starlette/httpx which resolve it; >=4.2 clears anyio#642 (shield-shields-siblings). 4.14.1 installed.
]

# Dev-only tooling (not shipped with the app). Install with:
#   .venv/Scripts/python.exe -m pip install -e ".[dev]"
# This extra must declare EVERYTHING tools/check.py invokes via the venv (ruff, pyright, pytest) —
# CI builds a fresh venv from exactly this list, so a tool that "works locally" but isn't pinned
# here fails the gate (the SYS-14 first-run catch: ruff/pytest were hand-installed, undeclared).
# pyright[nodejs] uses the nodejs-wheel extra → hermetic bundled Node (reliable, no flaky
# first-run nodeenv download). Pip version tracks the pyright engine version, so this pin is
# reproducible. basic mode → ratchet to strict later (QUALITY.md / DECISIONS D33).
[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pyright[nodejs]==1.1.409",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version = `git describe` at install time (hatch-vcs → setuptools-scm). At an exact release tag
# (prod: install.sh re-runs `pip install -e .` on every re-pin) this yields the tag, e.g. "1.0.1";
# between tags (dev instance) it yields "1.0.2.dev1+g<sha>". Runtime reads it via importlib.metadata
# (app/__init__.py). `root = ".."` — the git repo root is one level up from backend/. No fallback
# version on purpose: every supported install is a git clone with tags (CI fetches them —
# fetch-depth: 0 in ci.yml), so a tagless build should fail loudly, not ship as 0.0.0.
[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ruff = the 2026 standard lint+format (replaces flake8/black/isort). Honors `# noqa` by default; RUF100
# (unused-noqa) is NOT selected, so existing noqa comments are never touched. Run: `ruff check [--fix]` /
# `ruff format [--check]`. E/F/I from the start; ASYNC+B pulled in 2026-07-16 (SYS-16); UP/SIM still
# deferred. line-length matches the verbose-comment style.
[tool.ruff]
target-version = "py314"
line-length = 110

# pyright = the backend type checker (QUALITY.md / DECISIONS D33). basic mode is the warn-first
# baseline; ratchet to strict once green. venvPath/venv point at the local .venv so pyright
# resolves the same interpreter + installed deps. Run from backend/: `python -m pyright`.
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "ASYNC", "B"]
ignore = ["E501"]            # long lines are intentional here (verbose explanatory comments); keep F/I + other E
unfixable = ["RUF100"]
