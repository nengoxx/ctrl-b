# ctrl-b config — copy to config.yaml (gitignored) and fill in.
# Phase 0 reads only `server`; later phases add inference/voice/agents/hosts/mcp/... blocks
# (see docs/DESIGN.md §9 and docs/SPEC.md §6.3). Unknown keys round-trip losslessly.
#
# This file is the UI-managed source of truth and the ONLY home for secrets (per-host SSH creds,
# per-provider API keys). `.env`'s CTRLB_<SECTION>__<KEY> overrides reach DECLARED, ONE-LEVEL scalars
# only (e.g. CTRLB_SERVER__PORT) — they cannot address a credential, which lives two levels down at
# providers.<name>.api_key. See .env.example.

config_version: 1  # config shape version — managed by `python -m app.config_migration`

server:
  host: 127.0.0.1        # tailnet-only; front with Tailscale Serve for HTTPS (mic needs it)
  port: 5433             # 5433 coexists with the live Flask app on 5432 until cutover
  poll_seconds: 5        # fleet status poll cadence
  debug: false           # keep false — debug is an RCE surface. ON also raises the `app` logger to
                         # DEBUG, which is what turns on the per-tick presence trail (the diagnostic
                         # for a drifted DHCP reservation).
  # `Host` header allowlist — the anti-DNS-rebinding rail (R73, SECURITY_MODEL §2.9). EMPTY (the
  # default) = no check at all; non-empty = every OTHER name is answered `400 Invalid host header`,
  # on HTTP and WebSocket alike. A page on an attacker's domain that re-resolves to this machine's
  # address becomes SAME-ORIGIN, which is the one thing the raw-body-PUT write rail cannot defend
  # against — but the attacker never controls the name they must send in `Host`.
  #
  # ⚠ A NAME MISSING FROM A NON-EMPTY LIST ANSWERS 400 ON EVERY ROUTE, THE CONF UI INCLUDED —
  # recovery is editing config.yaml by hand and restarting. So list every name AND address you
  # actually browse by, not just the pretty one. Entries are exact names or ONE leading `*.`
  # wildcard; no ports (the Host's port is stripped before matching).
  # trusted_hosts:
  #   - emma                          # the bare hostname on the LAN
  #   - emma.lobster-vector.ts.net    # the Tailscale Serve name (Serve preserves Host end to end)
  #   - localhost
  #   - 127.0.0.1
  #   - 192.168.1.160                 # the LAN address literal — yours
  #   - 100.64.0.1                    # the tailnet (100.x) address literal — yours

# Notifications (F1) — v1 is the FOREGROUND channel only: the PWA raises a browser notification from
# the live streams it already holds, so the phone buzzes while the app is open or backgrounded. There
# is no server-side sender (Web Push / ntfy / bot are ROADMAP F1 futures), and closed-app delivery is
# NOT covered. Master `enabled` is the spam guard: while it's false nothing fires, whatever the
# per-event toggles say. Delivery also needs the browser permission (asked when you flip it on in
# Conf → Notifications) and a secure context — i.e. reach the app over Tailscale Serve HTTPS, not
# plain http, exactly like the mic.
# notifications:
#   enabled: false
#   events:
#     agent_input: true      # the agent is blocked on you (a confirm bubble, or a `question`)
#     turn_done: true        # an agent turn finished / hit its step limit / errored
#     action_failed: true    # a recorded action ended error / denied / timeout
#     automation_done: true  # a scheduled (or run-now) automation run finished — however it ended

# Fleet wake automation (ROADMAP D2) — BOTH triggers' tunables.
#
# D2-B wake-on-connect: `wake_on_connect` on a machine below fires that host's Wake-on-LAN whenever a
# client opens the live event stream — i.e. when you open the dashboard. `cooldown_s` bounds how often
# ONE host can be re-woken by reconnects (a phone drifting off wifi reopens the stream a lot); 0
# disables it. WOL is idempotent, so this is about keeping the Event log quiet.
#
# D2-A/D2-C wake-on-presence: `wake_on_presence` on a machine fires when the monitor sees one of YOUR
# devices ARRIVE, watched on two independent sources with one arming machine each. The tailnet source
# answers "I want the servers" (turning Tailscale on is a deliberate act); the LAN source answers
# "I'm home" (the phone rejoining the house Wi-Fi). A source only fires after the device was
# CONTINUOUSLY absent for its damping constant, so a radio blip cannot wake the fleet.
#   · presence_devices — one entry per watched device. Give either address or both. `lan_ip` should be
#     a DHCP RESERVATION on the router: a drifting lease looks exactly like the device leaving, and the
#     only warning is the presence trail in the journal (`server.debug: true` to see it).
#     `lan_offline_after_s` is PER DEVICE because it is a property of that radio's power management —
#     a phone that drops its association while dozing looks like a phone that left the house.
#   · lan_health_ip — an always-on address on the same LAN, normally the router, and never one of the
#     watched devices. `ping` reports "device unreachable" and "our link is dead" identically, so
#     without this an unplugged server would arm every device and wake the whole fleet on reconnect.
#     While this address does not answer, every LAN no-reply that tick is UNKNOWN, which disarms.
#     Unset = no gate; setting it is the recommended posture.
#   · quiet_hours — a local-time window in which a LAN arrival wakes nothing. LAN ONLY: a Tailscale
#     connect is deliberate and is never suppressed. Both times are QUOTED "HH:MM" strings (a bare
#     23:00 is a NUMBER to YAML); start == end is refused. Unset = never quiet, the default.
# wake:
#   cooldown_s: 300              # per-host seconds between wake-on-CONNECT fires (0 = every connect)
#   presence_cooldown_s: 3600    # per-host seconds between PRESENCE-driven wakes (both sources)
#   presence_offline_after_s: 120  # tailnet absence that must precede an arrival (R12's watchdog floor)
#   tailscale_socket_path: /var/run/tailscale/tailscaled.sock  # config, not an OS branch (Synology etc.)
#   lan_probe_count: 3           # echoes per LAN probe — several ride out Wi-Fi power-save buffering
#   lan_probe_timeout_s: 1       # per ECHO, not per probe
#   lan_health_ip: 192.168.1.1
#   presence_devices:
#     - name: phone              # the journal's name for it, and the key its state is held under
#       tailnet_ip: 100.64.0.2
#       lan_ip: 192.168.1.143
#       lan_offline_after_s: 900 # LAN absence before an arrival counts (5× the field's 180 s floor)
#   quiet_hours:
#     start: "23:00"
#     end: "07:00"

# Owner media (D52/D53 + D65's write path). The ART itself is FILES — drop them into
# $CTRLB_HOME/media/<ns>/<role>/ over SSH, or upload them from Conf → the gallery; this block only
# records what a folder listing cannot: the per-role PRIORITY list (`files`, one entry per picture:
# exactly one of `name` (a file in that folder) or `bundled` (an id the role ships), plus optional
# `key` / `hidden` / `focal`) and the cross-role `slots` pins. Everything the gallery writes lands
# here; you rarely hand-author it. `write.max_bytes` is the one knob that is purely yours: the
# streamed upload cap, counted as the body arrives (never from Content-Length).
# media:
#   write:
#     max_bytes: 15728640            # 15 MB
#   namespaces:
#     gacha:
#       roles:
#         characters:
#           files:
#             - name: lyra-2.png
#             - bundled: pegasus     # a shipped default, listed as a first-class library entry
#       slots: {wallpaper: lyra-2}   # a pin: the value is a file STEM (or a bundled id)

# Composer attachments (D68) — files attached to a chat message. The FILES live under
# $CTRLB_HOME/attachments/ (a flat `staging/` landing plus one directory per thread) and are written
# only by the app, so this block is knobs alone. `max_file_mb` is the streamed upload cap, counted as
# the body arrives (never from Content-Length); `max_files_per_message` bounds one send;
# `staging_orphan_hours` is how long an uploaded-but-never-sent file stays claimable — the same number
# the boot sweep reclaims by, so the two can never disagree about the same file.
# The model-feed knobs: `max_inline_chars` is how much of a text file rides inside the turn AND the
# page size `read_attachment` reads by; `image_tokens` is what one sent image is priced at when the
# context estimate decides to compact; `max_images_per_request` bounds how many images one assembled
# request may carry (the oldest degrade to a stub past it); `resend: false` sends only the CURRENT
# turn's images and stubs the older ones.
# A claimed PDF has its text extracted ONCE, into a sidecar the feed then reads like any text file:
# `max_pdf_pages` and `max_extracted_chars` are how far that goes. Both are SOFT — they stop the
# extraction loop, so the page that crosses the character bound is kept whole — and they are the
# worst-case wait of a send that carries a big document.
# attachments:
#   max_files_per_message: 10
#   max_file_mb: 10
#   staging_orphan_hours: 24
#   max_inline_chars: 16000
#   image_tokens: 1000
#   max_images_per_request: 10
#   resend: true
#   max_pdf_pages: 200
#   max_extracted_chars: 400000

# Tailscale Serve (Phase 6c-2, D20) — the in-app HTTPS toggle (Conf → Access). `serve` only, never
# funnel (tailnet-only by construction). `target_port` = the local port Serve fronts: 5433 (the
# default) is the backend-served prod SPA; set 5173 to front the dev Vite server instead. Also
# settable from .env: CTRLB_TAILSCALE__TARGET_PORT=5173 (env wins over this file).
# tailscale:
#   enabled: true
#   target_port: 5433

# Providers (A11/D48) — the top-level name-keyed CONNECTION map. Each entry is one OpenAI-compatible
# server (base_url + api_mode + optional api_key + server-capacity knobs) carrying a name-keyed model
# catalog. EVERY consumer section (inference, voice.stt, voice.tts, embeddings) POINTS at a provider by
# name via a flat `provider` primary + ordered `fallbacks`. The map KEY is the provider slug and the
# `/<provider>` composer verb (e.g. /local //cloud switch chat backend per-message, 4c/C7).
# `local` needs no api_key (llama.cpp). Thinking models cold-load slowly — keep request_timeout_s generous.
providers:
  local:                            # slug ^[a-z0-9][a-z0-9_+.-]{0,31}$; the /local verb
    base_url: http://192.168.1.137:5001/v1
    # D45/D46: which API wire shape THIS server speaks — one explicit field (never auto-detected from
    # base_url) that drives BOTH the reasoning translation and the derived max_tokens_field. llama-server
    # IGNORES reasoning_effort but DOES honour a per-request token budget, so `llamacpp` makes the ladder
    # translate to reasoning_budget_tokens. Options: openai (default — effort only) | llamacpp |
    # openrouter (effort OR reasoning.max_tokens, never both) | none.
    api_mode: llamacpp
    # max_concurrent_requests: 1    # D40: app-side gate for a backend without request slots to spare
    # retry_attempts: 0             # D43: per-provider override of the global inference.retry_attempts
    models:                         # name-keyed catalog; KEY = clean display name, id defaults to the key
      minig+:
        # extra_body: per-MODEL OpenAI-SDK passthrough (ACA-18) — merged only into THIS model's call,
        # never blanket (OpenAI 400s on unknown args). The llama.cpp prompt-cache pin + telemetry:
        #   cache_prompt: true       # protective on older llama-server builds (recent builds default true)
        #   return_progress: true    # emit streaming prompt_progress so cache-hit telemetry shows up
        extra_body: { cache_prompt: true, return_progress: true }
        # context_window: 16384      # D42: manual per-model window; unset = auto-probed from llama.cpp
        #                            # /props (config always wins over the probe; cloud has no probe)
  cloud:                            # the /cloud verb
    base_url: https://openrouter.ai/api/v1
    api_key: sk-or-v1-...           # optional; omitted = no-auth. Masked in the API; blank-keeps on PUT
    api_mode: openrouter            # D45: reasoning.max_tokens when an agent sets an explicit
    #                               # reasoning_tokens, else reasoning_effort (our "off" → its "none");
    #                               # the two are MUTUALLY EXCLUSIVE upstream — sending both is a 400.
    models:
      gemini:
        id: google/gemini-2.0-flash-exp:free   # wire model id sent to the server (hidden in UI when == key)
        # extra_body: { stream_options: { include_usage: true } }  # cached_tokens telemetry (cloud)
        # context_window: 1000000    # D42: cloud windows are never probed — set manually or compaction
        #                            # falls back to the threshold_tokens trigger
      embed:                            # an embeddings model on the same cloud server (Slice 2)
        id: qwen/qwen3-embedding-4b     # OpenRouter serves qwen3-embedding-4b on /v1/embeddings
        dim: 2560                       # embeddings vector dimension (qwen3-embedding-4b = 2560)
  voice:                            # an OpenAI-compatible STT+TTS server (e.g. Speaches); the /voice verb
    base_url: http://192.168.1.137:9000/v1
    models:                         # STT + TTS models share one provider (one server = one base_url)
      whisper:                      # an STT model
        id: Systran/faster-whisper-large-v3   # wire model id; the catalog KEY is the clean display name
        language: en                # STT: force transcription language ("" → auto-detect)
      kokoro:                       # a TTS model
        id: speaches-ai/Kokoro-82M-v1.0-ONNX
        voice: bf_isabella          # TTS: server voice id (voice ids are model-specific)
        format: mp3                 # TTS: response container (mp3|opus|aac|flac|wav|pcm)
        # speed: 1.0                # TTS: playback-speed multiplier (>0; a per-request param)

inference:                          # request_timeout_s / system_prompt* / failover / retry_attempts STAY
  provider: local                   # PRIMARY (flat); model omittable iff the catalog has exactly one model
  request_timeout_s: 600
  system_prompt: ""      # optional; blank = the built-in ctrl-b assistant prompt
  failover: true
  retry_attempts: 2      # D43/Slice 7: CHAT-STREAM same-endpoint retry budget for TRANSIENT failures
                         # only (429 / 503 / Retry-After / llama.cpp busy-slot) — a busy-but-alive server
                         # is retried in place BEFORE hopping. A per-provider override lives on the
                         # provider (see `retry_attempts` under `local`). 0 = today's instant next-hop.
  fallbacks:             # ordered, N-deep; each {provider, model?}
    - provider: cloud
      model: gemini

# Agent runtime (Phase 4e+, compaction v2 = D42). `compaction` first clears old bulky tool outputs
# at assembly time (free — the DB keeps them verbatim), then folds the oldest complete turns into a
# rolling summary once the working context passes `context_window × threshold_frac` (or on a manual
# `/compact [instructions]`); with no window resolved (config or the local /props probe) the absolute
# `threshold_tokens` fallback triggers instead. The `summarizer` is independently selectable — leave
# mode/model blank to reuse the chat backend, or point it at a cheap/fast model.
agent:
  default_agent: ""          # name of the agents[] entry new threads use; blank = built-in default
  global_subagent_limit: 6   # process-wide cap on concurrent subagents across the whole tree (4.5)
  subagent_clamp_privilege: true  # clamp a subagent's privilege to never exceed its parent's (4.5);
                                  # false lets a configured subagent run at a higher privilege
  subagent_child_timeout_s: 180   # per-child wall-clock cap for spawn_subagents (read live per fan-out)
  skills_enabled: true       # master switch for the skills subsystem (4.5)
  skills_dir: skills         # dir scanned for <name>/SKILL.md (relative → alongside this config)
  skill_min_overlap: 1       # min token overlap for a skill to match a turn (baked at startup)
  skill_max_active: 2        # max skills that activate per turn (baked at startup)
  compaction:                # global context-window default; an agent/subagent can override it below
    enabled: true
    threshold_frac: 0.85     # D42: compact at this fraction of the endpoint's context window
    threshold_tokens: 6000   # NO-WINDOW fallback only (~chars/4 estimate) — used when no window resolves
    keep_last_messages: 8    # recent-message floor kept verbatim (snapped back to a turn boundary)
    keep_recent_tokens: 4096 # D42: recent-token floor (the larger of the two floors wins); 0 = off
    clear_output_min_tokens: 500  # D42: tool outputs bigger than this may be cleared at assembly
    clear_keep_steps: 2      # D42: the most recent N tool-call rounds of a PRIOR turn keep full outputs (min 1)
    clear_trigger_pct: 0.5   # D60: clear only above this fraction of the chain's smallest context window
    clear_min_reclaim_tokens: 1024  # D60: skip a trim that would reclaim less than this
    clear_exclude_tools: [task_plan, memory, core_memory]  # D60: results these tools return are never cleared
    max_consecutive_failures: 3   # D42: failed (non-shrinking) folds before auto-compaction latches off
    reserve_output: true     # D42: subtract the agent's model.max_tokens from the trigger line
    summarizer:
      provider: ""           # a providers-map name; blank inherits the inference primary (D48)
      model: ""              # blank inherits the provider's model
      # max_tokens: 1024     # D42: optional output cap for the summary call (ModelRef call config)
  # defaults:                # D43/Slice 7 — the AgentDef inheritance base (deep-merged into every agent).
  #                          # Failure-fallback model routing lives HERE as agent.defaults.routing (the
  #                          # global default — there is deliberately NO separate agent.routing; a per-agent
  #                          # agent.yaml `routing:` block overrides it). OFF by default (omit the block).
  #   routing:               # escalate to a designated SMARTER model after the worker crash-and-burns
  #                          # several turns in a row, for a few turns, then drop back to the worker.
  #     lead: { provider: cloud, model: "anthropic/claude-sonnet-4.5" }  # REQUIRED — the escalation target
  #     failure_threshold: 2 # consecutive HARD worker failures (chain-level inference error / iteration-
  #                          # exhaustion / stall guard — NOT wrong answers) that OPEN a fallback episode
  #     fallback_turns: 2    # how many logical turns ONE episode routes to `lead` before returning to the
  #                          # worker (a visible // note each way; the D18 failover chain runs unchanged
  #                          # underneath — routing only picks who is asked FIRST). Subagents: inert.

# Agent definitions (Phase 4.5, D11). Optional — with none configured a built-in default chat agent
# is used (all agent-exposed tools, CONFIRM privilege, the chat model). Add entries to run/select
# alternate agents (and to spawn them as subagents). Each is selectable per thread; one is default.
#
# Subagents INHERIT every parameter from the agent that spawns them — model, context-window
# (compaction), privilege, tool/skill allowlists, iteration & fan-out caps. A subagent named in
# spawn_subagents that you define below overrides ONLY the fields you set here (e.g. just prompt +
# tools); everything else is inherited from the parent. With no named subagent, a child is a full
# clone of the parent. (Privilege is still clamped to the parent unless subagent_clamp_privilege:false.)
# Tool selection & the weak-model opt-out (Phase 4.5 skills + capability layer):
#   A weak local model gets confused by a large, namespaced toolset (it hallucinates tool names like
#   `mcp__fleet_ping` and falls back to web search). Skills fix this WITHOUT globally restricting the
#   agent: an intent skill (skills/<name>/SKILL.md with `allowed_tools`) AUTO-ACTIVATES when the
#   request matches its description (KeywordSkillSelector, the little-coder approach) and narrows the
#   toolset for that turn. Keep `skills: "*"` so all intent skills can self-select.
#   OPT OUT for a capable model: set `skills: []` on its agent — no auto-narrowing, it sees every tool
#   and picks for itself (the Claude-Code approach). The selector itself is swappable (D11).
# agents:
#   - name: local              # weak local model — let intent skills auto-narrow the toolset
#     model: { provider: local, model: "minig+" }
#     tools: "*"               # full registry; skills narrow per-turn by intent
#     skills: "*"              # all discovered skills may auto-activate (fleet, web-research, ...)
#     privilege: confirm       # readonly | confirm | auto_low | full — gates med/high-risk tools
#     # Loop-discipline guards (capability layer C1) — raise for a research-heavy agent:
#     max_iterations: 16
#     max_repeat_calls: 2          # identical (tool,args) calls before suppression
#     max_calls_per_tool: 6        # total calls to any one tool per turn before refusal
#     max_stall_iterations: 2      # consecutive no-progress iterations before a forced final answer
#   - name: capable            # strong model — OPT OUT of auto-narrowing; full toolset, own judgment
#     model: { provider: cloud, model: "anthropic/claude-sonnet-4.5" }
#     # ModelRef call config (D42) — optional per-agent output/reasoning knobs (also in the Conf UI):
#     #   model: { provider: cloud, model: "...", max_tokens: 4096, reasoning_effort: high }
#     #   reasoning_effort ladder: off|minimal|low|medium|high|xhigh|max ("off" disables local
#     #   thinking via chat_template_kwargs; unknown values are ignored by llama.cpp)
#     tools: "*"
#     skills: []               # <- the opt-out: no skill auto-selection / no tool narrowing
#     max_calls_per_tool: 20   # a capable model can be trusted with a looser leash
#   - name: researcher         # e.g. spawned as a subagent — set only what differs; rest inherits parent
#     prompt: "You research topics with web tools and report concisely."
#     tools: [web_search, "mcp__*"]

# Agent memory. TIER 1 (D14/D15 #4, D26/D27) is the built-in file memory — per-agent MEMORY.md +
# global USER.md/STATE.md under `memory_dir`, capped and injected every turn. It is on by default and
# managed from Conf → Memory; nothing here is required.
# TIER 2 (D57) is the optional LONG-TERM slot: one selectable backend at a time, off by default.
# `core` = Core Memory — a shared, Claude-Code-native markdown corpus (a `MEMORY.md` routing index +
# semantic topic files) that is *not* injected whole: the bounded index rides the system head and the
# agent reads topics on demand. Living under `memory_dir` means the D26 git repo versions it for free
# (an absolute root is honored but unversioned). `backend` is the ONLY switch — null = off.
# memory:
#   longterm:
#     backend: null              # null = OFF (default) | "core"; future backends = new values
#     core:
#       root: core               # relative → under memory_dir; absolute honored (unversioned)
#       index_char_limit: 10240  # hard cap on the injected index block (chars)
#       topic_char_limit: 4096   # per-read topic cap (chars)
#       recall_char_limit: 24576 # per-turn total recall cap (chars; D64: 6 pages)
#       recall_min_charge_chars: 256  # D60: the minimum one read/search charges against that cap
#       consolidation_nudge_pct: 80  # index fill % at which the chat hints "run /consolidate"

# Per-tool overrides (Phase 8b, D22) — ONE unified object per tool: `description` sharpens the
# model-facing wording (the agent selects tools by description, so clearer wording steers a weak
# local model without code changes); `agent_mode` is the tri-state access mode (core | enabled |
# disabled; absent = the tool's built-in default). Applied live (no restart); edit in Conf → Tools.
# Names are the registry names (`ping_host`, `mcp__web-tools__search_web`, `api__<server>__<opId>`, ...).
# (The legacy flat `tool_descriptions:` map is still folded in on load, but this is the shape to write.)
# `approvals` (D44) is the third dimension on the SAME object: standing "always allow" grants that
# downgrade a *risk-derived* confirm to allow. Allow-only — a rule can never deny, and it can never
# bypass a designer forced-confirm (shutdown_host / reboot_host / run_shell stay un-approvable).
# Normally you don't hand-write these: tap "always" on a confirm bubble (the server writes an
# args-exact rule) and manage/revoke them in Conf → Tools. The YAML shape, for reference:
#   - a rule matches when EVERY field it lists matches (glob, `fnmatch`-style); rules are OR'd.
#   - **patterns are STRINGS** — quote numbers/booleans (`port: "22"`, `force: "true"`), they're
#     compared against the arg's canonical form (`5`, `1.5`, `true`, `null` for an omitted optional).
#   - a field the rule OMITS is **unconstrained** — that's the deliberate widening semantics.
#     `approvals: [{}]` (or `args: null`) is a whole-action grant: any args, always.
#   - deleting the entry (or the whole list) revokes; revocation is live from the next call.
# tool_overrides:
#   ping_host: { description: "Check whether a fleet host is reachable right now (ICMP). Use before assuming a host is up." }
#   web_search: { description: "Search the public internet. Use ONLY for information that isn't about the local fleet.", agent_mode: enabled }
#   terminal_exec:
#     approvals:
#       # 1) args-EXACT — what tapping "always" on a bubble writes: every top-level field pinned
#       #    (an omitted optional is pinned as the literal "null", so this does NOT match a call
#       #    that passes `cwd`).
#       - args: { command: "docker ps", cwd: "null" }
#       # 2) widened with a glob — hand-written / Conf-panel territory: any `systemctl status …`,
#       #    in any cwd (`cwd` is unlisted, therefore unconstrained).
#       - args: { command: "systemctl status *" }
#   restart_service:
#     # 3) a whole-action grant — this MED-risk action never asks again, whatever the args.
#     approvals: [{}]
#   core_memory:
#     # `max_calls` (D60) is the fourth dimension on the same object: this tool's per-turn call cap,
#     # REPLACING the agent's blanket `max_calls_per_tool` (absent = the blanket cap). Read-class
#     # `core_memory` calls (read/search) are exempt from the cap entirely — the recall budget bounds
#     # them — so this caps its WRITES.
#     max_calls: 12

# Character agents (D70) — the GLOBAL half of the feature; the per-agent half lives on each
# `agents/<slug>/agent.yaml` as ordinary flat fields (duties, greeting, scenario, post_history, …).
# `enabled` is presentation only — it shows/hides the character fields in the UI; nothing on the
# server branches on it, so a character keeps working with the switch off. `default_tools` is the
# minimal allowlist written to a newly imported character (widen it freely per agent). `persona` is
# who YOU are: `name` is what `{{user}}` renders as, and a non-empty `description` is injected as
# its own block after the fleet roster, for every agent.
# `card_import` is what the V1/V2/V3 card importer will ACCEPT: the multipart body cap, the decoded
# card JSON cap (that JSON is what ends up stashed in the agent's own file), and the CHARX zip's
# bounds — member count, per-member size, and total uncompressed size, all checked against the
# DECLARED sizes before anything is decompressed. Every one of them answers 413.
# roleplay:
#   enabled: false
#   default_tools: [web_search]
#   persona:
#     name: ""
#     description: ""
#   card_import:
#     max_bytes: 15000000
#     max_card_json_bytes: 2000000
#     charx_max_entries: 500
#     charx_max_entry_bytes: 15000000
#     charx_max_total_bytes: 50000000

# Voice subsystem (Phase 6; A11/D48 Slice 2) — push-to-talk STT + read-aloud TTS. Each service POINTS at
# the `providers` map above: a flat `provider` primary (+ `model`, omittable iff the catalog has exactly
# one model) and an ordered `fallbacks` chain that ALWAYS walks on any failure (a down endpoint degrades;
# there is deliberately no failover toggle). The per-service knobs stay here. The mic needs a secure
# context: front the app with HTTPS (`tailscale serve --bg --https=443 5433`).
voice:
  enabled: true
  stt:
    provider: voice        # see providers.voice above; `whisper` is the STT model
    model: whisper         # named because the `voice` catalog has >1 model
    fallbacks: []          # ordered {provider, model?}; walks on any failure
    language: en           # force transcription language; "" → auto-detect (model.language wins if set)
    vad_filter: true       # voice-activity detection: drop silence (avoids whisper silence-hallucinations)
    hotwords: ""           # space-separated recognition bias (fleet names, jargon)
    auto_send: false       # true → mic sends the transcript; false → fills the composer for review
    # Auto-stop dictation (R51 Tier 0) — the PWA ends the recording itself after a silence run, through
    # the same stop path as tapping the button (`auto_send` then applies unchanged). OFF = push-to-talk.
    auto_stop: false       # true → hands-free stop; false → tap to stop (the shipped default)
    auto_stop_silence_s: 3.0    # silence run that ends the recording (0.5–30)
    auto_stop_threshold: 0.01   # normalized RMS below this counts as silence (0.001–0.5; calibrate on-device)
    connect_timeout_s: 3   # fail-fast on an unreachable endpoint → fall over
    timeout_s: 30          # read window for the transcription itself
  tts:
    provider: voice        # `kokoro` is the TTS model (voice + format live on the model)
    model: kokoro
    fallbacks: []
    format: mp3            # response container (mp3|opus|aac|flac|wav|pcm); the model's format wins if set
    connect_timeout_s: 3
    timeout_s: 30
    # Chunked synthesis (D63) — the reply is split into speakable chunks that synth+play sequentially
    # on one <audio> element, so audio starts after the FIRST sentence instead of the whole clip.
    chunking: sentence     # off | paragraph | sentence ("off" = the pre-D63 whole-blob synth)
    chunk_format: opus     # per-chunk container; opus is sample-exact from a pipe (mp3 adds dead air)
    chunk_min_words: 4     # merge floor — a chunk under BOTH floors keeps accumulating forward
    chunk_min_chars: 50
    chunk_max_chars: 400   # split at the last word boundary under this (must be <= max_text_chars)
    chunk_lookahead: 1     # synth-ahead depth (1 = synthesize chunk N+1 while N plays)
    speak_actions: false   # D74: read roleplay actions (*he leans in*) aloud; false (default) DROPS those spans
                           # (bold still reads — emphasis is speech, a stage direction is not)
  # Live voice / call mode (Phase 24, D71) — the realtime EAR behind `WS /api/voice/live`. Same
  # pointer shape as stt/tts; leave `provider` blank and it resolves exactly like `voice.stt` (one
  # Speaches box serves both doors). Shipped OFF: flip `enabled` when the call loop is calibrated.
  live:
    enabled: false         # whole-feature toggle; `voice.enabled` above outranks it
    # provider: voice      # blank → resolve like voice.stt (the common case)
    # model: parakeet      # the realtime `model` query param; blank inherits stt's
    vad_threshold: 0.9     # Silero speech-probability floor (Speaches' default); the next call's base — the call screen's Speech slider overrides it per call
    silence_ms: 700        # silence run that ends an utterance (100–10000); rides session.update
    min_speech_ms: 300     # CLIENT interruption floor — speech shorter than this is not a barge-in
    frame_ms: 40           # uplink frame duration (10–200); also the flush burst's granularity
    max_session_s: 1800    # hard session lifetime; 1800 aligns with Speaches' own 30-min expiry
    max_frame_bytes: 32768 # max accepted binary uplink frame
    buffered_ceiling_ms: 1000   # CLIENT outbound-buffer ceiling before close+reconnect
    call_backlog_ms: 1000  # CLIENT pacer backlog for a call leg, in ms of audio; past it the OLDEST
                           # frames are dropped (the mirror of relay_queue_ms below, one hop upstream).
                           # Dictation's pacer is lossless instead and ignores this.
    barge_threshold: 0     # CLIENT RMS floor for the barge-in gate; 0 = reuse stt.auto_stop_threshold
    min_final_ms: 200      # D74/R76: ms of mic energy ABOVE that floor an utterance must carry before
                           # its transcript becomes a turn — the near-speech gate that keeps a TV or
                           # the next room out of the conversation (0 = off, the pre-D74 commit)
    debug: false           # CLIENT: show the live gate numbers on the call overlay (calibration aid)
    max_sessions: 1        # process-wide concurrent live sessions (a second connect gets `busy`)
    echo_workaround: auto  # auto | on | off — auto = capability-detected per track, never UA-sniffed
    barge_in: false        # CLIENT: hands-free interruption (default off = tap-to-interrupt only); when on, the owner-verified floor was barge_threshold 0.06 on the SPEAKER route (NOT route-portable — R78); needs an open-ear route — inert on speaker-hifi
    route: speaker-hifi    # CLIENT: speaker (platform AEC → comm mode, open ear) | speaker-hifi (D75 ⑥
                           # DEFAULT: EC off → clean media-path audio following the system's own routing,
                           # mic pauses while the reply speaks) | headphones (EC off, open ear — only
                           # honest with no acoustic echo path)
    ring: true             # CLIENT: overlay mode — true = focal-anchored face ring
    # Streaming DICTATION (S2.5) — the mic's hold/lock rides the SAME realtime ear as the call, and
    # each utterance final appends to the composer draft live. Independent of `enabled` in both
    # directions: this switch alone opens the ear, no call feature required. OFF = today's whole-clip
    # POST through voice.stt. All four are CLIENT knobs; the relay enforces none of them.
    dictation: false       # whole-feature toggle for streaming dictation
    tail_wait_ms: 2000     # how long the client waits for the TAIL final after its release flush
    dictation_idle_s: 15   # hands-free idle stop for a LOCKED session (the trailing phrase is kept)
    dictation_max_s: 120   # hard cap on ONE streaming session — applies to hold as well as lock
    relay_queue_ms: 2000   # bounded relay queue, in ms of audio; overflow drops the OLDEST frames
    start_timeout_s: 5     # how long an accepted socket may sit before its `start` message arrives
    allowed_origins: []    # EXTRA exact `scheme://host[:port]` strings the WS Origin check admits
                           # (empty = same-host only; browser CORS does not protect WebSockets)
    connect_timeout_s: 3   # realtime handshake budget (no next hop — there is no live failover)
    timeout_s: 30          # read window once established

# Embeddings backend (Phase 4f, D9; A11/D48 Slice 2). POINTS at the `providers` map — a flat `provider`
# primary (+ `model`, omittable iff the catalog has exactly one model) and an ordered `fallbacks` chain of
# {provider, model?} (embeddings gains failover for free). The connection + the vector size (`dim` on the
# model) live on the referenced provider; only `enabled` + the SDK read window `timeout_s` are here. Powers
# the vector MemoryProvider + semantic search when Phase 7 lands; no consumer before then.
embeddings:
  provider: cloud          # the connection; the `embed` model carries `dim` (see providers.cloud above)
  model: embed             # named because the `cloud` catalog has >1 model
  fallbacks: []            # ordered {provider, model?}; all non-null `dim`s in the chain must AGREE
  enabled: true
  timeout_s: 60            # SDK read window for the embeddings call

# SearXNG metasearch → the agent's `web_search` tool (Phase 4f, D9). Point base_url at your
# instance (no trailing /search). The instance must enable the JSON format in its settings.yml
# (`search: { formats: [html, json] }`) — a stock SearXNG serves HTML only and web_search will
# report that. Leave it out or set enabled:false to disable the tool.
searxng:
  base_url: http://192.168.1.160:8888
  enabled: true
  timeout_s: 10
  language: ""             # optional default UI language (e.g. "en"); blank = instance default

# open-webui/open-terminal → curated agent shell + file tools (Phase 4f). A Bearer-auth REST API
# (a "computer you can curl") giving the agent a remote shell + file ops on the host it runs on.
# Risk is per-operation: reads (read/list/grep/glob) auto-run; exec + writes confirm by default —
# it's arbitrary remote shell, so keep those gated unless you really trust it. `api_key` must match
# the server's --api-key / OPEN_TERMINAL_API_KEY. Omit the block (or enabled:false) to disable.
open_terminal:
  base_url: http://192.168.1.160:9999
  api_key: changeme
  enabled: true
  timeout_s: 30
  default_wait_s: 30       # synchronous-exec wait window (seconds)
  exec_risk: high          # low | med | high  (HIGH → the agent confirms before running)
  write_risk: high
  read_risk: low

# Generic OpenAPI/REST tool servers (Phase 4f) — the HTTP sibling of mcp_servers, for Open WebUI
# "tool servers" or any service exposing an OpenAPI doc. Each operation becomes a tool
# `api__<server>__<operationId>`. GET/HEAD ops auto-run (reads); mutating verbs use `risk` (default
# med → confirm). A server whose spec won't load is skipped. `include` optionally allowlists ops.
openapi_servers:
  - name: my-tools
    base_url: http://192.168.1.160:8080   # spec fetched from base_url + /openapi.json …
    # spec_url: http://192.168.1.160:8080/openapi.json   # … or set explicitly
    api_key: ""              # optional bearer token
    auth_scheme: Bearer      # header value prefix ("" → send the raw key)
    risk: med                # risk for mutating ops; GET/HEAD always auto-run
    enabled: true
    # include: [search, fetch]   # optional operationId/path allowlist

# MCP servers the agent connects to as a client (Phase 4f, D9). Each server's tools are discovered
# at startup and merged into the agent's toolset, namespaced `mcp__<server>__<tool>`. A down server
# is skipped (its tools just won't be present that run) — it never blocks startup. `risk` gates ALL
# of that server's tools: med/high → the agent confirms before each call (safe for remote tools);
# set `low` for a server you trust to let its tools auto-run. Both transports are wired
# (streamable_http + stdio, live-verified — Phase 4f).
mcp_servers:
  - name: web-tools
    transport: streamable_http   # streamable_http | stdio
    url: http://192.168.1.160:3003/mcp
    # headers: { Authorization: "Bearer …" }   # optional, for an authenticated server
    risk: med                    # low | med | high
    enabled: true
  # A stdio (local subprocess) server:
  # - name: filesystem
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
  #   risk: high

# The fleet, keyed by host name (the live wol_server_win.py `computers{}` shape — copy yours in).
# Each host's stable id is a slug of its name. ssh_password is a secret: masked on API read,
# never logged. Omit mac for hosts you won't Wake-on-LAN; omit ssh_* for ping-only hosts.
computers:
  pegasus:
    ip: 192.168.1.10
    mac: "00:11:22:33:44:55"
    ssh_username: nengo
    ssh_password: changeme
    ssh_port: 22
    os_type: linux
    role: nas
    # wake_on_connect: true  # D2-B — WOL this box when you open the dashboard (needs the mac above)
    # Services nest under their host (Phase 3). Each gets a stable id "<host-slug>.<svc-slug>".
    # Liveness is DERIVED, not stored: the `port` is TCP-probed each poll (a port-less service
    # just tracks its host being up). The svc-row links to http://<ip>:<port><path> when online.
    # `cmd` holds the per-OS start/stop/restart commands — only the host's os_type variant runs;
    # a missing one yields a clean "no <action> command configured" instead of an error.
    services:
      jellyfin:
        kind: jellyfin
        port: 8096
        cmd:
          start:   {linux: "sudo systemctl start jellyfin"}
          stop:    {linux: "sudo systemctl stop jellyfin"}
          restart: {linux: "sudo systemctl restart jellyfin"}
      syncthing:
        port: 8384          # no cmd → shows status + URL only (no control actions)
  atlas:
    ip: 192.168.1.12
    mac: "6c:0b:84:ad:e1:0f"
    ssh_username: admin
    ssh_password: changeme
    ssh_port: 22
    os_type: windows
    services:
      plex:
        kind: plex
        port: 32400
        path: /web         # opens http://192.168.1.12:32400/web
        cmd:
          start:   {windows: "net start PlexService"}
          stop:    {windows: "net stop PlexService"}
          restart: {windows: "net stop PlexService & net start PlexService"}
  mercury:
    ip: 192.168.1.15
    mac: "b8:27:eb:0a:9c:21"
    ssh_username: media
    ssh_password: changeme
    os_type: windows
  vega:
    ip: 192.168.1.20
    mac: "04:7c:16:fe:88:2a"
    ssh_username: nengo
    ssh_password: changeme
    ssh_port: 2222
    os_type: linux
