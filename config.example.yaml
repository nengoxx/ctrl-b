# ctrl-b config — copy to $CTRLB_HOME/config.yaml (gitignored; with CTRLB_HOME unset, the repo root) and
# fill in. Every key, its default and when a change applies: docs/user-guide/configuration-reference.md.
# Unknown keys round-trip losslessly — which also means a MISSPELT key or section loads silently and does
# nothing (no warning). Agents are FOLDERS ($CTRLB_HOME/agents/<name>/), never a list in this file.
#
# This file is the UI-managed source of truth and the ONLY home for secrets (per-host SSH creds,
# per-provider API keys). `.env`'s CTRLB_<SECTION>__<KEY> overrides reach DECLARED, ONE-LEVEL scalars
# only (e.g. CTRLB_SERVER__POLL_SECONDS) — they cannot address a provider or host credential, which lives two
# levels down (providers.<name>.api_key); the one secret they can set is open_terminal.api_key. See .env.example.

config_version: 5  # config shape version — managed by `python -m app.config_migration`; don't edit

server:
  # host/port are INERT (ISS-91): the listening socket comes from the uvicorn command line in the
  # systemd unit / run.sh / start.ps1; port only changes what /api/health reports and nothing reads host.
  # To move the port, edit the unit's ExecStart (and tailscale.target_port).
  host: 127.0.0.1
  port: 5433
  poll_seconds: 5        # fleet status poll cadence (cache TTL + the app's refresh); monitor.poll_seconds must be >= it
  feature_cycle_seconds: 6  # how long the Fleet hero shows one online host before moving on
  debug: false           # ON raises the `app` logger to DEBUG (restart-required) — that is all it does
                         # (no debugger, no error pages); it turns on the per-tick presence trail (the
                         # diagnostic for a drifted DHCP reservation).
  # `Host` header allowlist — the anti-DNS-rebinding rail (R73, SECURITY_MODEL §2.9). EMPTY (the
  # default) = no check at all; non-empty = every OTHER name is answered `400 Invalid host header`,
  # on HTTP and WebSocket alike. A page on an attacker's domain that re-resolves to this machine's
  # address becomes SAME-ORIGIN, which is the one thing the raw-body-PUT write rail cannot defend
  # against — but the attacker never controls the name they must send in `Host`.
  #
  # ⚠ A NAME MISSING FROM A NON-EMPTY LIST ANSWERS 400 ON EVERY ROUTE, THE CONF UI INCLUDED —
  # recovery is editing config.yaml by hand and restarting. So list every name AND address you
  # actually browse by, not just the pretty one. Entries are exact names or ONE leading `*.`
  # wildcard; no ports (the Host's port is stripped before matching). Read at startup only — a change
  # needs a restart, and Conf does not say so (ISS-92); there is no Conf form for it.
  # trusted_hosts:
  #   - emma                          # the bare hostname on the LAN
  #   - emma.lobster-vector.ts.net    # the Tailscale Serve name (Serve preserves Host end to end)
  #   - localhost
  #   - 127.0.0.1
  #   - 192.168.1.160                 # the LAN address literal — yours
  #   - 100.64.0.1                    # the tailnet (100.x) address literal — yours

# Notifications (F1) — v1 is the FOREGROUND channel only: the PWA raises a browser notification from
# the live streams it already holds, and ONLY while the page is HIDDEN (another tab, another app, the
# screen off with the PWA still running) — never while you are looking at it, and a `turn_done` is
# skipped during a live call. There is no server-side sender (Web Push / ntfy / bot are ROADMAP F1
# futures), so a closed app gets nothing. Master `enabled` is the spam guard: while it's false nothing fires, whatever the
# per-event toggles say. Delivery also needs the browser permission (asked when you flip it on in
# Conf) and a secure context — i.e. reach the app over Tailscale Serve HTTPS, not
# plain http, exactly like the mic.
# notifications:
#   enabled: false
#   events:
#     agent_input: true      # the agent is blocked on you (a confirm bubble, or a `question`)
#     turn_done: true        # an agent turn finished / hit its step limit / errored
#     action_failed: true    # a recorded action ended error / denied / timeout
#     automation_done: true  # a scheduled (or run-now) automation run finished — however it ended
#     host_up_down: true     # the monitor confirmed a host went down or came back

# Fleet wake automation (ROADMAP D2) — BOTH triggers' tunables.
#
# D2-B wake-on-connect: `wake_on_connect` on a machine below fires that host's Wake-on-LAN whenever a
# client opens the live event stream — i.e. when you open the dashboard. `cooldown_s` bounds how often
# ONE host can be re-woken by reconnects (a phone drifting off wifi reopens the stream a lot); 0
# disables it. WOL is idempotent, so this is about keeping the Event log quiet.
#
# D2-A/D2-C wake-on-presence: `wake_on_presence` on a machine fires when the monitor sees one of YOUR
# devices ARRIVE, watched on two independent sources with one arming machine each. The tailnet source
# answers "I want the servers" (turning Tailscale on is a deliberate act); the LAN source answers
# "I'm home" (the phone rejoining the house Wi-Fi). A source only fires after the device was
# CONTINUOUSLY absent for its damping constant, so a radio blip cannot wake the fleet.
#   · presence_devices — one entry per watched device. Give either address or both. `lan_ip` should be
#     a DHCP RESERVATION on the router: a drifting lease looks exactly like the device leaving, and the
#     only warning is the presence trail in the journal (`server.debug: true` to see it).
#     `lan_offline_after_s` is PER DEVICE because it is a property of that radio's power management —
#     a phone that drops its association while dozing looks like a phone that left the house.
#   · lan_health_ip — an always-on address on the same LAN, normally the router, and never one of the
#     watched devices. `ping` reports "device unreachable" and "our link is dead" identically, so
#     without this an unplugged server would arm every device and wake the whole fleet on reconnect.
#     While this address does not answer, every LAN no-reply that tick is UNKNOWN, which disarms.
#     Unset = no gate; setting it is the recommended posture.
#   · quiet_hours — a local-time window in which a LAN arrival wakes nothing. LAN ONLY: a Tailscale
#     connect is deliberate and is never suppressed. Both times are QUOTED "HH:MM" strings (a bare
#     23:00 is a NUMBER to YAML); start == end is refused. Unset = never quiet, the default.
# wake:
#   cooldown_s: 300              # per-host seconds between wake-on-CONNECT fires (0 = every connect)
#   presence_cooldown_s: 3600    # per-host seconds between PRESENCE-driven wakes (both sources)
#   presence_offline_after_s: 120  # tailnet absence that must precede an arrival (R12's watchdog floor)
#   tailscale_socket_path: /var/run/tailscale/tailscaled.sock  # config, not an OS branch (Synology etc.)
#   lan_probe_count: 3           # echoes per LAN probe — several ride out Wi-Fi power-save buffering
#   lan_probe_timeout_s: 1       # per ECHO, not per probe
#   lan_health_ip: 192.168.1.1
#   presence_devices:
#     - name: phone              # the journal's name for it, and the key its state is held under
#       tailnet_ip: 100.64.0.2
#       lan_ip: 192.168.1.143
#       lan_offline_after_s: 900 # LAN absence before an arrival counts (5× the field's 180 s floor)
#   quiet_hours:
#     start: "23:00"
#     end: "07:00"

# Fleet monitor (D2-A/D50) — the backend's own watcher. Every `poll_seconds` it reads the shared fleet
# sweep and records a `host_down` / `host_up` Event once a host has missed `down_after_checks` checks in
# a row / answered `up_after_checks` in a row (asymmetric on purpose: a false DOWN is noise, a false UP
# is harmless). A check that could not be MADE counts as UNKNOWN and resets both counters. It is also
# what drives `wake_on_presence` — off, nothing presence-driven fires. Applies live.
# monitor:
#   enabled: true
#   poll_seconds: 30         # 1–3600; must be >= server.poll_seconds (else one cached sweep counts as several checks)
#   down_after_checks: 3     # 1–100
#   up_after_checks: 2       # 1–100

# Scheduled automations (A3/D49) — the RUNNER's knobs only; the automations themselves live in the
# database and are managed in Conf. One run at a time; a slot later than `misfire_grace_s` is recorded
# `missed` and skipped. NONE of these keys has a Conf form — hand-edit and restart.
# automations:
#   enabled: true            # master switch for SCHEDULES; "run now" still works while it is false
#   poll_seconds: 10         # how often the claim scan runs (1–3600)
#   default_timeout_s: 300   # wall-clock limit for a run that sets none of its own (1–86400)
#   max_count: 20            # how many automations may exist (1–500)
#   misfire_grace_s: 300     # how late a slot may still fire (0–86400)
#   keep_runs: 50            # run rows kept per automation; older ones go WITH their threads (1–1000)

# Owner media (D52/D53 + D65's write path). The ART itself is FILES — drop them into
# $CTRLB_HOME/media/<ns>/<role>/ over SSH, or upload them from Conf → the gallery; this block only
# records what a folder listing cannot: the per-role PRIORITY list (`files`, one entry per picture:
# exactly one of `name` (a file in that folder) or `bundled` (an id the role ships), plus optional
# `key` / `hidden` / `focal`) and the cross-role `slots` pins. Everything the gallery writes lands
# here; you rarely hand-author it. `write.max_bytes` is the one knob that is purely yours: the
# streamed upload cap, counted as the body arrives (never from Content-Length).
# media:
#   write:
#     max_bytes: 15728640            # 15 MB
#   namespaces:
#     gacha:
#       roles:
#         characters:
#           files:
#             - name: lyra-2.png
#               focal: {x: 0.5, y: 0.3, z: 1.5, rev: ""}   # framing point 0–1 (+ zoom); `rev` = the file
#                                    # revision it was set on — a mismatch reads as reset. The gallery writes it
#             - name: old-pic.webp
#               hidden: true         # kept in the library, never used
#             - name: atlas-alt.png
#               key: atlas           # bind to a named-role key explicitly (default: the filename stem)
#             - bundled: pegasus     # a shipped default, listed as a first-class library entry
#       slots:
#         wallpaper: {name: lyra-2.png}   # a pin: {name: <a file of the SOURCE role>} or {bundled: <shipped id>};
#                                         # null = unpinned. Slots today: gacha `wallpaper` + `oracle` (from characters)

# Composer attachments (D68) — files attached to a chat message. The FILES live under
# $CTRLB_HOME/attachments/ (a flat `staging/` landing plus one directory per thread) and are written
# only by the app, so this block is knobs alone. `max_file_mb` is the streamed upload cap, counted as
# the body arrives (never from Content-Length); `max_files_per_message` bounds one send;
# `staging_orphan_hours` is how long an uploaded-but-never-sent file stays claimable — the same number
# the boot sweep reclaims by, so the two can never disagree about the same file.
# The model-feed knobs: `max_inline_chars` is how much of a text file rides inside the turn AND the
# page size `read_attachment` reads by; `image_tokens` is what one sent image is priced at when the
# context estimate decides to compact; `max_images_per_request` bounds how many images one assembled
# request may carry (the oldest degrade to a stub past it); `resend: false` sends only the CURRENT
# turn's images and stubs the older ones.
# A claimed PDF has its text extracted ONCE, into a sidecar the feed then reads like any text file:
# `max_pdf_pages` and `max_extracted_chars` are how far that goes. Both are SOFT — they stop the
# extraction loop, so the page that crosses the character bound is kept whole — and they are the
# worst-case wait of a send that carries a big document.
# attachments:
#   max_files_per_message: 10
#   max_file_mb: 10
#   staging_orphan_hours: 24
#   image_max_dimension: 2048    # the APP downscales a photo to this longest edge before upload
#   image_quality: 0.85          # …and re-encodes it at this quality (0–1)
#   max_inline_chars: 16000
#   image_tokens: 1000
#   max_images_per_request: 10
#   resend: true
#   max_pdf_pages: 200
#   max_extracted_chars: 400000

# Tailscale Serve (Phase 6c-2, D20) — the in-app HTTPS toggle (the card at the bottom of Conf → Server). `serve` only, never
# funnel (tailnet-only by construction). `target_port` = the local port Serve fronts: 5433 (the
# default) is the backend-served prod SPA; set 5173 to front the dev Vite server instead. Also
# settable from .env: CTRLB_TAILSCALE__TARGET_PORT=5173 (env wins over this file).
# tailscale:
#   enabled: true
#   target_port: 5433
#   timeout_s: 15              # subprocess timeout for each `tailscale` CLI call

# Providers (A11/D48) — the top-level name-keyed CONNECTION map. Each entry is one OpenAI-compatible
# server (base_url + api_mode + optional api_key + server-capacity knobs) carrying a name-keyed model
# catalog. EVERY consumer section (inference, voice.stt, voice.tts, embeddings) POINTS at a provider by
# name via a flat `provider` primary + ordered `fallbacks`. The map KEY is the provider slug and the
# `/<provider>` composer verb (e.g. /local //cloud switch chat backend per-message, 4c/C7).
# `local` needs no api_key (llama.cpp). Thinking models cold-load slowly — keep request_timeout_s generous.
providers:
  local:                            # slug ^[a-z0-9][a-z0-9_+.-]{0,31}$; the /local verb
    base_url: http://192.168.1.137:5001/v1
    # D45/D46: which API wire shape THIS server speaks — one explicit field (never auto-detected from
    # base_url) that drives BOTH the reasoning translation and the derived max_tokens_field. llama-server
    # IGNORES reasoning_effort but DOES honour a per-request token budget, so `llamacpp` makes the ladder
    # translate to reasoning_budget_tokens. Options: openai (default — effort only) | llamacpp |
    # openrouter (effort OR reasoning.max_tokens, never both) | none.
    api_mode: llamacpp
    # max_concurrent_requests: 1    # D40: app-side gate for a backend without request slots to spare
    # retry_attempts: 0             # D43: per-provider override of the global inference.retry_attempts
    models:                         # name-keyed catalog; KEY = clean display name, id defaults to the key
      minig+:
        # extra_body: per-MODEL OpenAI-SDK passthrough (ACA-18) — merged only into THIS model's call,
        # never blanket (OpenAI 400s on unknown args). The llama.cpp prompt-cache pin + telemetry:
        #   cache_prompt: true       # protective on older llama-server builds (recent builds default true)
        #   return_progress: true    # emit streaming prompt_progress so cache-hit telemetry shows up
        extra_body: { cache_prompt: true, return_progress: true }
        # context_window: 16384      # D42: manual per-model window; unset = auto-probed from llama.cpp
        #                            # /props (config always wins over the probe; cloud has no probe)
        # input_modalities: [text, image]  # D68: what the model accepts. OMITTED = TEXT-ONLY — an
        #                            # attached image is replaced by an error note for this model
        # max_tokens_field: max_tokens  # D46: per-model output-cap field (max_tokens | max_completion_tokens);
        #                            # also settable on the provider; unset = derived from api_mode
  cloud:                            # the /cloud verb
    base_url: https://openrouter.ai/api/v1
    api_key: sk-or-v1-...           # optional; omitted = no-auth. Masked in the API; blank-keeps on PUT
    api_mode: openrouter            # D45: reasoning.max_tokens when an agent sets an explicit
    #                               # reasoning_tokens, else reasoning_effort (our "off" → its "none");
    #                               # the two are MUTUALLY EXCLUSIVE upstream — sending both is a 400.
    models:
      gemini:
        id: google/gemini-2.0-flash-exp:free   # wire model id sent to the server (hidden in UI when == key)
        # extra_body: { stream_options: { include_usage: true } }  # cached_tokens telemetry (cloud)
        # context_window: 1000000    # D42: cloud windows are never probed — set manually or compaction
        #                            # falls back to the threshold_tokens trigger
      embed:                            # an embeddings model on the same cloud server (Slice 2)
        id: qwen/qwen3-embedding-4b     # OpenRouter serves qwen3-embedding-4b on /v1/embeddings
        dim: 2560                       # embeddings vector dimension (qwen3-embedding-4b = 2560)
  voice:                            # an OpenAI-compatible STT+TTS server (e.g. Speaches); the /voice verb
    base_url: http://192.168.1.137:9000/v1
    models:                         # STT + TTS models share one provider (one server = one base_url)
      whisper:                      # an STT model
        id: Systran/faster-whisper-large-v3   # wire model id; the catalog KEY is the clean display name
        language: en                # STT: force transcription language ("" → auto-detect)
      kokoro:                       # a TTS model
        id: speaches-ai/Kokoro-82M-v1.0-ONNX
        voice: bf_isabella          # TTS: server voice id (voice ids are model-specific)
        format: mp3                 # TTS: response container (mp3|opus|aac|flac|wav|pcm)
        # speed: 1.0                # TTS: playback-speed multiplier (>0; a per-request param)
  # Phase 26 (ASR_PLAN §3.7, §4): parakeet.cpp's `parakeet-server` v0.5.0 — one machine-wide instance per
  # door (deploy/linux/README.md "The ASR engines"). It serializes inference on one mutex, so each
  # provider declares `max_concurrent_requests: 1`: a request behind a long clip waits connect_timeout_s
  # for the D40 permit, then WALKS to the next hop instead of parking on the engine. It reads only the
  # WAV `file` (the clip door always sends 16 kHz WAV chunks) and ignores the model id + every other
  # field; one catalog model each, so a section may omit `model`.
  # parakeet-clip:                  # the clip door: voice.stt → [parakeet-clip, <a whisper fallback>]
  #   base_url: http://127.0.0.1:9011/v1
  #   max_concurrent_requests: 1
  #   models:
  #     parakeet-tdt-0.6b-v3: {}
  # parakeet-live:                  # RESERVED for the future live ear; serves NOTHING today — the call's ear
  #                                 # dials a realtime /realtime endpoint (Speaches), see voice.live below
  #   base_url: http://127.0.0.1:9010/v1
  #   max_concurrent_requests: 1
  #   models:
  #     parakeet-tdt-0.6b-v3: {}

inference:                          # request_timeout_s / system_prompt* / failover / retry_attempts STAY
  provider: local                   # PRIMARY (flat); null = chat unconfigured
  # model: minig+                   # omittable iff the provider's catalog has exactly one model
  request_timeout_s: 600
  connect_timeout_s: 5   # D83: give up REACHING an endpoint after this (refused/no route/silent host)
                         # and hop to the next — the 600 s above stays the read window once connected
  connect_cooldown_s: 60 # D83: an endpoint found unreachable is tried LAST for this long (never skipped;
                         # its first successful answer clears it early). 0 = off
  system_prompt: ""      # optional; blank = the built-in ctrl-b assistant prompt (the root SOUL.md wins over it)
  system_prompt_append: ""  # added after whichever base prompt is active, for every agent (the agent's own append follows)
  failover: true
  retry_attempts: 2      # D43/Slice 7: CHAT-STREAM same-endpoint retry budget for TRANSIENT failures
                         # only (429 / 503 / Retry-After / llama.cpp busy-slot) — a busy-but-alive server
                         # is retried in place BEFORE hopping. A per-provider override lives on the
                         # provider (see `retry_attempts` under `local`). 0 = today's instant next-hop.
  fallbacks:             # ordered, N-deep; each {provider, model?}
    - provider: cloud
      model: gemini

# Agent runtime (Phase 4e+, compaction v2 = D42). `compaction` first clears old bulky tool outputs
# at assembly time (free — the DB keeps them verbatim), then folds the oldest complete turns into a
# rolling summary once the working context passes `context_window × threshold_frac` (or on a manual
# `/compact [instructions]`); with no window resolved (config or the local /props probe) the absolute
# `threshold_tokens` fallback triggers instead. The `summarizer` is independently selectable — leave
# mode/model blank to reuse the chat backend, or point it at a cheap/fast model.
agent:
  default_agent: ""          # "" = none set (a new thread gets the root/default agent) · "default" = the root,
                             # explicitly · "<name>" = that $CTRLB_HOME/agents/<name>/ folder
  default_title: ""          # display name for the root/default agent
  global_subagent_limit: 6   # process-wide cap on concurrent subagents (4.5) — read at STARTUP: restart (ISS-92)
  subagent_clamp_privilege: true  # clamp a subagent's privilege to never exceed its parent's (4.5);
                                  # false lets a configured subagent run at a higher privilege
  subagent_child_timeout_s: 180   # per-child wall-clock cap for spawn_subagents (read live per fan-out)
  skills_enabled: true       # master switch for the skills subsystem (4.5)
  skills_auto_write: true    # the agent may write SKILL.md itself; false → propose-only
  skills_dir: skills         # dir scanned for <name>/SKILL.md (relative → $CTRLB_HOME, never follows
                             # CTRLB_CONFIG). Read at startup: restart after changing it (ISS-92)
  skill_min_overlap: 1       # min token overlap for a skill to match a turn (baked at startup: restart)
  skill_max_active: 2        # max skills that activate per turn (baked at startup: restart)
  streaming: auto            # auto | on | off — on = always stream (SSE), off = one buffered reply (a flaky link);
                             # auto follows the request (the PWA always streams). A bare on/off is read correctly
  compaction:                # global context-window default; an agent/subagent can override it below
    enabled: true
    threshold_frac: 0.85     # D42: compact at this fraction of the endpoint's context window
    threshold_tokens: 6000   # NO-WINDOW fallback only (~chars/4 estimate) — used when no window resolves
    keep_last_messages: 8    # recent-message floor kept verbatim (snapped back to a turn boundary)
    keep_recent_tokens: 4096 # D42: recent-token floor (the larger of the two floors wins); 0 = off
    clear_output_min_tokens: 500  # D42: tool outputs bigger than this may be cleared at assembly
    clear_keep_steps: 2      # D42: the most recent N tool-call rounds of a PRIOR turn keep full outputs (min 1)
    clear_trigger_pct: 0.5   # D60: clear only above this fraction of the chain's smallest context window
    clear_min_reclaim_tokens: 1024  # D60: skip a trim that would reclaim less than this
    clear_exclude_tools: [task_plan, memory, core_memory]  # D60: results these tools return are never cleared
    max_consecutive_failures: 3   # D42: failed (non-shrinking) folds before auto-compaction latches off
    reserve_output: true     # D42: subtract the agent's model.max_tokens from the trigger line
    summarizer:
      provider: ""           # a providers-map name; blank inherits the inference primary (D48)
      model: ""              # blank inherits the provider's model
      # max_tokens: 1024     # D42: optional output cap for the summary call (ModelRef call config)
      # reasoning_effort: low  # off|minimal|low|medium|high|xhigh|max; blank = the backend default
      # reasoning_tokens: 512  # explicit reasoning budget; ignored when reasoning_effort is "off"
  # turns:                   # D39 — limits for running turns (no Conf form; read per turn)
  #   max_active_turns: 4    # turns running at once across all threads; past it a send gets 409 busy
  #   steer_queue_max: 8     # messages queued into one running turn; past it → 409 busy
  #   ring_size: 2048        # per-turn replay ring (a reconnect cache, never the durability floor)
  #   subscriber_queue_size: 256  # per-device fan-out queue; overflow detaches that device (it re-attaches)
  #   terminal_cache_cap: 32 # finished turns remembered for a late re-attach…
  #   linger_s: 60           # …and for how long
  #   ping_s: 15             # chat SSE keepalive, INT seconds
  #   send_timeout_s: 30     # drop a frozen reader without touching the turn
  #   shutdown_grace_s: 5    # how long running turns get to stop at shutdown
  # defaults:                # the AgentDef inheritance base (deep-merged into every agent; an agent.yaml field
  #                          # wins). Any AgentDef field: model, privilege, tools, skills, guards, … — a
  #                          # specialist never inherits title / greeting / alt_greetings / greeting_enabled.
  #   model: { provider: local, model: "minig+", max_tokens: 4096, reasoning_effort: medium }
  #   privilege: confirm     # readonly | confirm | auto_low | full — gates med/high-risk tools
  #                          # D43/Slice 7:
  #                          # Failure-fallback model routing lives HERE as agent.defaults.routing (the
  #                          # global default — there is deliberately NO separate agent.routing; a per-agent
  #                          # agent.yaml `routing:` block overrides it). OFF by default (omit the block).
  #   routing:               # escalate to a designated SMARTER model after the worker crash-and-burns
  #                          # several turns in a row, for a few turns, then drop back to the worker.
  #     lead: { provider: cloud, model: "anthropic/claude-sonnet-4.5" }  # REQUIRED — the escalation target
  #     failure_threshold: 2 # consecutive HARD worker failures (chain-level inference error / iteration-
  #                          # exhaustion / stall guard — NOT wrong answers) that OPEN a fallback episode
  #     fallback_turns: 2    # how many logical turns ONE episode routes to `lead` before returning to the
  #                          # worker (a visible // note each way; the D18 failover chain runs unchanged
  #                          # underneath — routing only picks who is asked FIRST). Subagents: inert.

# Agent definitions (D14/D15 #3) are FOLDERS, never a list in this file: each specialist is
# $CTRLB_HOME/agents/<name>/agent.yaml (its AgentDef fields: title, model, tools, skills, privilege,
# guards, compaction, routing, character fields, …) + SOUL.md (its persona). The root/default agent is
# $CTRLB_HOME itself (its SOUL.md + `agent.defaults` above, no agent.yaml). Create and edit them in Conf;
# a pasted `agents:` list here loads, does nothing, and warns nowhere. Field reference:
# docs/user-guide/agents.md. A minimal agents/researcher/agent.yaml:
#   model: { provider: cloud, model: gemini }
#   tools: [web_search, "mcp__*"]
#   skills: []               # opt out of intent-skill auto-narrowing (a capable model picks its own tools)
#   privilege: confirm
# Subagents INHERIT every parameter from the agent that spawns them; a named subagent overrides only
# the fields its own agent.yaml sets. (Privilege is still clamped to the parent unless
# agent.subagent_clamp_privilege: false.)

# Agent memory. TIER 1 (D14/D15 #4, D26/D27) is the built-in file memory — per-agent MEMORY.md +
# global USER.md/STATE.md under `memory_dir`, capped and injected every turn. It is on by default and
# managed from Conf → Memory; nothing here is required.
# TIER 2 (D57) is the optional LONG-TERM slot: one selectable backend at a time, off by default.
# `core` = Core Memory — a shared, Claude-Code-native markdown corpus (a `MEMORY.md` routing index +
# semantic topic files) that is *not* injected whole: the bounded index rides the system head and the
# agent reads topics on demand. Living under `memory_dir` means the D26 git repo versions it for free
# (an absolute root is honored but unversioned). `backend` is the ONLY switch — null = off.
# memory:
#   enabled: true              # master switch (gates tier 2 too)
#   user_profile_enabled: true # inject + allow writes to the shared USER.md
#   auto_write: true           # the agent may write memory itself; false → propose, you approve
#   consolidation_nudge: false # near the cap, the block asks the agent to merge/prune before adding
#   consolidation_nudge_pct: 80
#   memory_dir: memories       # relative → $CTRLB_HOME; the D26 git repo root
#   memory_char_limit: 2200    # per-agent MEMORY.md cap (chars)
#   user_char_limit: 1375      # USER.md cap (chars)
#   state_enabled: false       # D27: a per-agent STATE.md (mood/energy/lately) the agent rewrites
#   state_char_limit: 600
#   reflection_enabled: false  # D27: every N user turns, nudge the agent to save what is worth keeping
#   reflection_interval: 10
#   git_backup:                # D26: every memory write is committed; no Conf form
#     enabled: true
#     author_name: ctrl-b memory     # per-commit identity (your global git config is untouched)
#     author_email: memory@ctrl-b.local
#     commit_timeout_s: 10     # per git invocation
#     reconcile_interval_s: 120  # sweep that commits your HAND edits to memory files; 0 = off (live)
#   longterm:
#     backend: null              # null = OFF (default) | "core"; future backends = new values
#     core:
#       root: core               # relative → under memory_dir; absolute honored (unversioned)
#       index_char_limit: 10240  # hard cap on the injected index block (chars)
#       topic_char_limit: 4096   # per-read topic cap (chars)
#       recall_char_limit: 24576 # per-turn total recall cap (chars; D64: 6 pages)
#       recall_min_charge_chars: 256  # D60: the minimum one read/search charges against that cap
#       consolidation_nudge_pct: 80  # index fill % at which the chat hints "run /consolidate"

# Per-tool overrides (Phase 8b, D22) — ONE unified object per tool: `description` sharpens the
# model-facing wording (the agent selects tools by description, so clearer wording steers a weak
# local model without code changes); `agent_mode` is the tri-state access mode (core | enabled |
# disabled; absent = the tool's built-in default). Applied live (no restart); edit in Conf → Tools.
# Names are the registry names (`ping_host`, `mcp__web-tools__search_web`, `api__<server>__<opId>`, ...).
# (The legacy flat `tool_descriptions:` map is still folded in on load, but this is the shape to write.)
# `approvals` (D44) is the third dimension on the SAME object: standing "always allow" grants that
# downgrade a *risk-derived* confirm to allow. Allow-only — a rule can never deny, and it can never
# bypass a designer forced-confirm (shutdown_host / reboot_host / run_shell stay un-approvable).
# Normally you don't hand-write these: tap "always" on a confirm bubble (the server writes an
# args-exact rule) and manage/revoke them in Conf → Tools. The YAML shape, for reference:
#   - a rule matches when EVERY field it lists matches (glob, `fnmatch`-style); rules are OR'd.
#   - **patterns are STRINGS** — quote numbers/booleans (`port: "22"`, `force: "true"`), they're
#     compared against the arg's canonical form (`5`, `1.5`, `true`, `null` for an omitted optional).
#   - a field the rule OMITS is **unconstrained** — that's the deliberate widening semantics.
#     `approvals: [{}]` (or `args: null`) is a whole-action grant: any args, always.
#   - deleting the entry (or the whole list) revokes; revocation is live from the next call.
# tool_overrides:
#   ping_host: { description: "Check whether a fleet host is reachable right now (ICMP). Use before assuming a host is up." }
#   web_search: { description: "Search the public internet. Use ONLY for information that isn't about the local fleet.", agent_mode: enabled }
#   terminal_exec:
#     approvals:
#       # 1) args-EXACT — what tapping "always" on a bubble writes: every top-level field pinned
#       #    (an omitted optional is pinned as the literal "null", so this does NOT match a call
#       #    that passes `cwd`).
#       - args: { command: "docker ps", cwd: "null" }
#       # 2) widened with a glob — hand-written / Conf-panel territory: any `systemctl status …`,
#       #    in any cwd (`cwd` is unlisted, therefore unconstrained).
#       - args: { command: "systemctl status *" }
#   restart_service:
#     # 3) a whole-action grant — this MED-risk action never asks again, whatever the args.
#     approvals: [{}]
#   core_memory:
#     # `max_calls` (D60) is the fourth dimension on the same object: this tool's per-turn call cap,
#     # REPLACING the agent's blanket `max_calls_per_tool` (absent = the blanket cap). Read-class
#     # `core_memory` calls (read/search) are exempt from the cap entirely — the recall budget bounds
#     # them — so this caps its WRITES.
#     max_calls: 12

# Character agents (D70) — the GLOBAL half of the feature; the per-agent half lives on each
# `agents/<slug>/agent.yaml` as ordinary flat fields (duties, greeting, scenario, post_history, …).
# `enabled` is presentation only — it shows/hides the character fields in the UI; nothing on the
# server branches on it, so a character keeps working with the switch off. `default_tools` is the
# minimal allowlist written to a newly imported character (widen it freely per agent).
# `personas` is a LIBRARY of who YOU are (D78) — for any agent, roleplay or not: `name` is what
# `{{user}}` renders as, and a non-empty `description` is injected as its own block after the fleet
# roster. Add/rename/remove them in Conf › Roleplay (the key is minted once from the name and never
# changes). `default_persona` is the one every agent talks to unless its own `agent.yaml` links
# another with `persona: <key>`; "" → none (`{{user}}` is then "User"). A key that is not in the
# library simply does not resolve — the next rung takes over.
# `card_import` is what the V1/V2/V3 card importer will ACCEPT: the upload body cap, the decoded
# card JSON cap (that JSON is what ends up stashed in the agent's own file), and the CHARX zip's
# bounds — member count, per-member size, and total uncompressed size, all checked against the
# DECLARED sizes before anything is decompressed. Every one of them answers 413.
# roleplay:
#   enabled: false
#   default_tools: [web_search]
#   personas:
#     ari: { name: "Ari", description: "{{user}} runs a small homelab." }
#     the-dm: { name: "The DM", description: "" }
#   default_persona: ari   # an agent.yaml overrides it with e.g. `persona: the-dm`
#   card_import:
#     max_bytes: 15000000
#     max_card_json_bytes: 2000000
#     charx_max_entries: 500
#     charx_max_entry_bytes: 15000000
#     charx_max_total_bytes: 50000000

# Lorebooks (D70 §6) — books of entries injected when their keys come up. The BOOKS are files,
# $CTRLB_HOME/lorebooks/<slug>.yaml, managed in Conf; this block is the globals only.
# lorebooks:
#   books: []                  # book slugs attached to EVERY agent (unioned with each agent's own list)
#   scan_depth: 2              # prior messages scanned with the new one; 0 = only what you just said
#   budget_chars: 4000         # per-turn cap on activated entry text; lowest priority evicted first
#   max_import_bytes: 15000000 # book-import body cap (413 past it)
#   include_names: true        # scan rows as "<speaker>: <text>" so a key naming a speaker fires; no Conf form

# Prompt overrides (Phase 18, D56) — one entry per registered prompt id, edited in Conf. `override`
# replaces the baked default; `append` is added after whichever base won. Blank = unset; deleting the
# entry restores the default.
# prompts:
#   <prompt-id>:
#     override: "…"
#     append: "…"

# Appearance (Phase 11) — the cross-device theme selection. Written by the app (server-stamped,
# last write wins); you don't normally hand-edit it. null = "no choice yet" (the device keeps its own).
# appearance:
#   theme: cosmos
#   mode: dark
#   accent: violet
#   motion: null               # full | reduced
#   perf: null                 # frosted-bar blur: full | lite
#   theme_settings: null       # {themeId: {option: value}}
#   kit_background_visible: null
#   appbar_subtitle_visible: null
#   chat_avatars_visible: null
#   agent_backdrop: null       # operator | full | off
#   pwa_icon_background: null  # transparent | ink | night | orchid | paper
#   updated_at: null           # server-stamped on each appearance write — never edit

# Voice subsystem (Phase 6; A11/D48 Slice 2) — push-to-talk STT + read-aloud TTS. Each service POINTS at
# the `providers` map above: a flat `provider` primary (+ `model`, omittable iff the catalog has exactly
# one model) and an ordered `fallbacks` chain that ALWAYS walks on any failure (a down endpoint degrades;
# there is deliberately no failover toggle). The per-service knobs stay here. The mic needs a secure
# context: front the app with HTTPS (`tailscale serve --bg --https=443 5433`).
voice:
  enabled: true
  stt:
    provider: voice        # see providers.voice above; `whisper` is the STT model
    model: whisper         # named because the `voice` catalog has >1 model
    fallbacks: []          # ordered {provider, model?}; walks on any failure
    language: en           # force transcription language; "" → auto-detect (model.language wins if set)
    vad_filter: true       # ask a whisper-type server to drop silence — INERT on the current Parakeet and
                           # Speaches targets (they ignore it / have no such field)
    hotwords: ""           # space-separated recognition bias (fleet names, jargon) — whisper-type servers only
    max_upload_bytes: 26214400  # largest clip accepted (25 MB); 413 past it
    # extra_body: {}       # advanced: fields passed straight to the server (rarely needed)
    auto_send: false       # true → mic sends the transcript; false → fills the composer for review
    # Auto-stop dictation (R51 Tier 0) — the PWA ends the recording itself after a silence run, through
    # the same stop path as tapping the button (`auto_send` then applies unchanged). OFF = push-to-talk.
    auto_stop: false       # true → hands-free stop; false → tap to stop (the shipped default)
    auto_stop_silence_s: 3.0    # silence run that ends the recording (0.5–30)
    auto_stop_threshold: 0.01   # normalized RMS below this counts as silence (0.001–0.5; calibrate on-device)
    # The clip upload (ISS-84) — bounded + retried, never silently dropped: after the last attempt the clip
    # waits in a Retry / Discard notice. One attempt may take max(this, 2 × the clip's length).
    upload_timeout_s: 30.0      # one attempt's horizon FLOOR, seconds (> 0, ≤ 600)
    upload_attempts: 3          # total attempts before the clip is parked (1–10)
    connect_timeout_s: 3   # fail-fast on an unreachable endpoint → fall over
    timeout_s: 30          # read window for the transcription itself
  tts:
    provider: voice        # `kokoro` is the TTS model (voice + format live on the model)
    model: kokoro
    fallbacks: []
    format: mp3            # response container (mp3|opus|aac|flac|wav|pcm); the model's format wins if set
    max_text_chars: 4096   # longest text one synthesis request may carry (422 past it); chunk_max_chars must fit under it
    connect_timeout_s: 3
    timeout_s: 30
    # extra_body: {}       # advanced: fields passed straight to the server
    # Chunked synthesis (D63) — the reply is split into speakable chunks that synth+play sequentially
    # on one <audio> element, so audio starts after the FIRST sentence instead of the whole clip.
    chunking: sentence     # off | paragraph | sentence ("off" = the pre-D63 whole-blob synth)
    chunk_format: opus     # per-chunk container; opus is sample-exact from a pipe (mp3 adds dead air)
    chunk_min_words: 4     # merge floor — a chunk under EITHER floor keeps accumulating forward
    chunk_min_chars: 50
    chunk_max_chars: 400   # split at the last word boundary under this (must be <= max_text_chars)
    chunk_lookahead: 1     # synth-ahead depth (1 = synthesize chunk N+1 while N plays)
    chunk_read_along: true # speak WHILE the reply streams, a sentence at a time (no effect under chunking: off)
    trim_silence: true     # cut the digital-silence pad some servers add (PocketTTS); WAV only, server-side
    speak_actions: false   # D74: read roleplay actions (*he leans in*) aloud; false (default) DROPS those spans
                           # (bold still reads — emphasis is speech, a stage direction is not)
    # The hidden-page hold (ISS-73 ①) — while a reply (or a clip upload) is pending with the screen off or
    # the app in the background, an inaudible tone keeps the page awake so the reply speaks in your
    # pocket. Uses battery; calls have their own `live.background_keepalive`. Off → it plays on return.
    background_keepalive: true
    background_idle_s: 600      # the hold lets go after this long with no progress, seconds (0 = no limit, ≤ 3600)
  # Live voice / call mode (Phase 24, D71) — the realtime EAR behind `WS /api/voice/live`. Same
  # pointer shape as stt/tts; leave `provider` blank and it resolves exactly like `voice.stt` (one
  # Speaches box serves both doors). ON since v1.7.8 (S4 closed 2026-09-26): the call rides the
  # realtime chain once one is configured; `enabled: false` turns the whole feature off.
  # ⚠ The ear dials `<base_url>/realtime` on the chain's FIRST entry (no live failover). If voice.stt
  # points at a parakeet-server (no /realtime), a blank provider here breaks calls — name a Speaches
  # provider explicitly.
  live:
    enabled: true          # whole-feature toggle; `voice.enabled` above outranks it
    # provider: voice      # blank → resolve like voice.stt (the common case — see the ⚠ above)
    # model: parakeet      # the realtime `model` query param; blank inherits stt's
    # fallbacks: []        # accepted for the shared shape; a live session never moves to one
    # extra_body: {}
    vad_threshold: 0.6     # Silero speech-probability floor (0.5–0.8; D76/R84 — its END threshold is this − 0.15); rides session.update
    silence_ms: 700        # silence run that ends an utterance (500–1200); rides session.update
    prefix_padding_ms: 300 # S11: pre-roll on the START of every speech segment (0–1000), so a phrase keeps
                           # its onset; rides session.update (the owned Speaches fork honours it)
    turn_hold_ms: 2500     # CLIENT (ISS-55): the call's THINKING PAUSE — after you stop, wait this long before
                           # sending what you said; talking again inside it joins the same message (and
                           # restarts the wait). Every reply starts this much later (0–10000; 0 = send at once)
    min_speech_ms: 300     # CLIENT interruption floor — speech shorter than this is not a barge-in
    frame_ms: 40           # uplink frame duration (10–200); also the flush burst's granularity
    max_session_s: 1800    # hard session lifetime; 1800 aligns with Speaches' own 30-min expiry
    max_frame_bytes: 32768 # max accepted binary uplink frame
    buffered_ceiling_ms: 1000   # CLIENT outbound-buffer ceiling before close+reconnect
    call_backlog_ms: 1000  # CLIENT pacer backlog for a call leg, in ms of audio; past it the OLDEST
                           # frames are dropped (the mirror of relay_queue_ms below, one hop upstream).
                           # Dictation's pacer is lossless instead and ignores this. Together with the
                           # send-buffer ceiling (buffered_ceiling_ms) it must fit the 30 s uplink
                           # allowance — a value that does not is refused at load (a Conf 422).
    min_final_ms: 200      # D74/R76: ms of mic energy at or above the RELATIVE floor (the gate six below)
                           # an utterance must carry before its transcript becomes a turn — the
                           # near-speech gate that keeps a TV or the next room out of the conversation;
                           # a drop plays a short cue (0 = off, the pre-D74 commit)
    noise_verdict_ms: 1000 # CLIENT: a reply ready while a sound is still going WAITS for it (never cancelled);
                           # after this long a sound with less than min_final_ms of energy is judged noise
                           # (a TV) and the reply starts over it. Real speech is never timed out (0 = never
                           # judge — the reply always waits for the sound to stop)
    debug: false           # CLIENT: show the live gate numbers on the call overlay (calibration aid);
                           # D77: ALSO writes a per-call trail to <CTRLB_HOME>/calls/<call>.jsonl
                           # Phase 26 S6-ii: AND RECORDS each leg's audio beside it, <call>-<leg>.wav
                           # (16 kHz, ~1.9 MB/min, anyone audible included; SECURITY_MODEL §2.12)
                           # Phase 26 S9: AND each push-to-talk upload (the clip door) — a trail + its
                           # decoded audio in calls/clip/<id>.jsonl + <id>-1.wav (a dictation's whole-clip
                           # fallback joins that dictation's trail as <call>-0.wav); no transcript text
    trail_keep: 20         # D77: how many trails to keep (1–500) PER KIND — calls in calls/, dictations in calls/dictation/ (Phase 26 S1), clips in calls/clip/ (S9); the oldest go when a new one starts
                           # — and take their recordings with them (worst case ≈ keep × legs × 1.9 MB/min)
    max_sessions: 1        # process-wide concurrent live sessions (a second connect gets `busy`)
    mic_hold: auto         # CLIENT: mic off while the reply speaks (and through its tail) — auto | on | off.
                           # auto = held unless the track's echo cancellation reads "all" (the D73 rule, D80);
                           # off = never held — the reply may be transcribed
    barge_in: false        # CLIENT: hands-free interruption (default off = tap-to-interrupt only); when on, speech must clear the relative floor + playback_margin_db below; needs an open ear — inert while the mic is held
    route: media           # CLIENT: media (DEFAULT: EC off → clean media-path audio, follows Bluetooth
                           # like music, phone speaker otherwise) | call (platform AEC → phone-call mode,
                           # echo-cancelled, the hands-free device's own mic)
    input_device: ""       # CLIENT: the capture deviceId ("" = the system default); on Android the mic list IS
                           # the route picker. Asked as `ideal`, so a vanished device falls back to the default
    # D73 S6 / R75 — the BACKGROUND wave (CLIENT): a hidden page keeps the call; `pagehide` still ends it.
    background: true       # false = the old behaviour: the page going away ends the call cleanly
    background_keepalive: true  # an inaudible-but-nonzero source while hidden, so Chrome Android does not
                           # freeze the page and deafen the ear (a deliberate battery-protection defeat)
    background_idle_s: 600 # a BACKGROUNDED call with no speech, no final in flight and no reply ends after
                           # this many seconds (0 = off; ceiling 4 × 1800)
    # D76 / R83 — the RELATIVE near-speech gate, in dB (CLIENT): the floor follows the measured room noise
    # and your learned voice level, clamped into [min_dbfs, max_dbfs]; it gates finals AND barge-in.
    floor_dbfs: -45        # bootstrap ceiling: the floor before a noise estimate, and its cap meanwhile
    noise_margin_db: 10    # floor ≥ measured room noise + this
    voice_margin_db: 10    # floor ≥ learned own-voice level − this
    playback_margin_db: 10 # barge floor = effective floor + this while the reply plays
    min_dbfs: -60          # clamp bounds on the effective floor
    max_dbfs: -20
    # D80 / R91 — the TAIL HOLD (CLIENT): while mic_hold holds, the ear stays held AFTER the reply ends
    # (a car plays it seconds late) until the room sits under noise + tail_quiet_margin_db for
    # tail_quiet_ms, unbroken — not before hold_tail_min_ms, never past hold_tail_max_ms
    hold_tail_min_ms: 300  # (0–5000) headphones/speakers still lag the phone this much
    tail_quiet_ms: 700     # (100–5000) bridges 97% of the pauses inside a reply
    tail_quiet_margin_db: 10  # (0–40) dB over the room's own noise
    hold_tail_max_ms: 5000 # (500–15000) min + quiet must fit under it
    tail_lag_margin_ms: 300  # (0–2000) D80 ⑦ wave 1.5: when the connect chirp MEASURED the speaker's delay, the
                           # tail ends at that delay + this (a deadline); the quiet rule above is the fallback
    # D80 / R91 §3 — the TEXT BACKSTOP (CLIENT): a final right after the reply that repeats its SPOKEN
    # words is the reply heard back — dropped, and the call screen says so
    echo_similarity: 0.75  # (0.5–1.0) the car call's echoes scored 0.95–1.0, genuine turns ≤ 0.54
    echo_window_ms: 4000   # (0–15000) ms after the tail's release still compared; 0 = only during the tail
    chirp: true            # D80 / R93: a short "connected" sweep at every capture; the mic's copy of it measures
                           # how late the speaker plays — the mic stays off that long (+ tail_lag_margin_ms) after
                           # each reply; shown in the debug readout + trail
    ring: true             # CLIENT: overlay mode — true = a face ring over the art (one fixed position)
    captions: true         # CLIENT: the reply as small fading captions on the call screen
    # Streaming DICTATION (S2.5) — the mic's hold/lock rides the SAME realtime ear as the call, and
    # each utterance final appends to the composer draft live. Independent of `enabled` in both
    # directions: this switch alone opens the ear, no call feature required. OFF = today's whole-clip
    # POST through voice.stt. All five are CLIENT knobs; the relay enforces none of them.
    dictation: false       # whole-feature toggle for streaming dictation
    tail_wait_ms: 2000     # how long the client waits for the TAIL final after its release flush
    dictation_idle_s: 300  # hands-free idle stop for a LOCKED session (the trailing phrase is kept); 0 = off.
                           # 300 so the owner's own pauses never end a dictation (R21)
    dictation_idle_margin_db: 10  # (0–40) dB above the room's measured noise below which you count as
                           # silent — raise it if your pauses never stop a dictation, lower it if it
                           # stops while you speak; relative, so another phone or a car cannot misread it
    dictation_max_s: 1790  # hard cap on ONE streaming session — applies to hold as well as lock; must stay
                           # under max_session_s so the dictation ends before the relay cuts it (interim)
    release_tail_ms: 400   # S11: after YOU stop (release / tap), keep recording this long so the last word
                           # is not clipped (0–1500; 0 = off). Whole-clip dictation too. Cancel, a call,
                           # a hidden page, the cap and the silence auto-stop stay immediate
    relay_queue_ms: 2000   # bounded relay queue, in ms of audio; overflow drops the OLDEST frames
    start_timeout_s: 5     # how long an accepted socket may sit before its `start` message arrives
    uplink_idle_s: 15      # R86: a leg with NO uplink audio this long (s, 5–120) is a frozen page or a dead
                           # ear — ended rather than held to max_session_s; must outlast tail_wait_ms
    allowed_origins: []    # EXTRA exact `scheme://host[:port]` strings the WS Origin check admits
                           # (empty = same-host only; browser CORS does not protect WebSockets)
    vad_model: silero-v6.2 # Phase 26: the relay-owned VAD model (silero-v6.2 | silero-v5.1.2). Config-only;
                           # a swap is a RE-CALIBRATION — set vad_threshold to the replay's recommendation
                           # and re-run the pre-pass sweep (docs/ASR_PLAN.md §3.4.1)
    connect_timeout_s: 3   # realtime handshake budget (no next hop — there is no live failover)
    timeout_s: 30          # read window once established

# Embeddings backend (Phase 4f, D9; A11/D48 Slice 2). POINTS at the `providers` map — a flat `provider`
# primary (+ `model`, omittable iff the catalog has exactly one model) and an ordered `fallbacks` chain of
# {provider, model?} (embeddings gains failover for free). The connection + the vector size (`dim` on the
# model) live on the referenced provider; only `enabled` + the SDK read window `timeout_s` are here.
# NOTHING reads it today (ISS-96): conversation search and Core Memory search are plain text search.
embeddings:
  provider: cloud          # the connection; the `embed` model carries `dim` (see providers.cloud above)
  model: embed             # named because the `cloud` catalog has >1 model
  fallbacks: []            # ordered {provider, model?}; all non-null `dim`s in the chain must AGREE
  enabled: true
  timeout_s: 60            # SDK read window for the embeddings call

# SearXNG metasearch → the agent's `web_search` tool (Phase 4f, D9). Point base_url at your
# instance (no trailing /search). The instance must enable the JSON format in its settings.yml
# (`search: { formats: [html, json] }`) — a stock SearXNG serves HTML only and web_search will
# report that. Leave it out or set enabled:false to disable the tool.
searxng:
  base_url: http://192.168.1.160:8888
  enabled: true
  timeout_s: 10
  language: ""             # optional default UI language (e.g. "en"); blank = instance default

# open-webui/open-terminal → curated agent shell + file tools (Phase 4f). A Bearer-auth REST API
# (a "computer you can curl") giving the agent a remote shell + file ops on the host it runs on.
# Risk is per-operation: reads (read/list/grep/glob) auto-run; exec + writes confirm by default —
# it's arbitrary remote shell, so keep those gated unless you really trust it. `api_key` must match
# the server's --api-key / OPEN_TERMINAL_API_KEY. Omit the block (or enabled:false) to disable.
# The tools and their three risks are registered ONCE AT STARTUP (ISS-92): a risk change, or enabling /
# configuring a base_url that was off/empty at boot, needs a restart — Conf does not say so. Disabling
# is live (the tools then answer DENIED).
open_terminal:
  base_url: http://192.168.1.160:9999
  api_key: changeme
  enabled: true
  timeout_s: 30
  default_wait_s: 30       # synchronous-exec wait window (seconds)
  exec_risk: high          # low | med | high  (HIGH → the agent confirms before running)
  write_risk: high
  read_risk: low

# Guarded LOCAL shell (Phase 5) — on the machine that runs ctrl-b (open-terminal above is a REMOTE box).
# Two independent doors, both OFF by default: `user_exec_enabled` = the `!<cmd>` composer escape hatch,
# `agent_exec_enabled` = the agent's `run_shell` at EVERY privilege (off → denied; on → a confirm per call
# below full, and an agent at full runs it unasked — ISS-87, fixed 2026-10-22).
# shell:
#   enabled: true              # master switch; false → every run_shell / `!` is DENIED, before any bubble
#   user_exec_enabled: false   # the `!<cmd>` composer escape hatch
#   agent_exec_enabled: false  # the agent's run_shell (off → denied at every privilege)
#   workdir: ""                # cwd for commands; blank → $CTRLB_HOME
#   timeout_s: 60              # kills the shell only — a child it forked keeps running (ISS-89)
#   max_output_chars: 6000     # output is cut to this, keeping the HEAD

# Secret redaction: every tool result is masked against the secrets configured here before it is shown,
# stored or sent to a model. Values shorter than `min_len` are not masked (a short value is ordinary text).
redact:
  min_len: 8                   # chars; 8 = the NIST password floor — the config paths of shorter values are logged at startup (never the values)

# Generic OpenAPI/REST tool servers (Phase 4f) — the HTTP sibling of mcp_servers, for Open WebUI
# "tool servers" or any service exposing an OpenAPI doc. Each operation becomes a tool
# `api__<server>__<operationId>`. GET/HEAD ops auto-run (reads); mutating verbs use `risk` (default
# med → confirm). A server whose spec won't load is skipped. `include` optionally allowlists ops.
openapi_servers:
  - name: my-tools
    base_url: http://192.168.1.160:8080   # spec fetched from base_url + /openapi.json …
    # spec_url: http://192.168.1.160:8080/openapi.json   # … or set explicitly
    api_key: ""              # optional bearer token
    auth_scheme: Bearer      # header value prefix ("" → send the raw key)
    # auth_header: Authorization # the header that carries it
    # headers: {}              # extra headers (secret-looking names are masked in the API)
    risk: med                # risk for mutating ops; GET/HEAD always auto-run
    enabled: true
    connect_timeout_s: 15
    call_timeout_s: 60       # wall-clock cap for ONE whole tool call
    # include: [search, fetch]   # optional operationId/path allowlist

# MCP servers the agent connects to as a client (Phase 4f, D9). Each server's tools are discovered
# at startup and merged into the agent's toolset, namespaced `mcp__<server>__<tool>`. A down server
# is skipped (its tools just won't be present that run) — it never blocks startup. Risk is PER TOOL:
# a tool the server annotates readOnlyHint runs LOW (auto-runs), destructiveHint runs HIGH (even on a
# `low` server); every other tool takes the server's `risk` (med/high → the agent confirms; `low` lets
# a trusted server's tools auto-run). Both transports are wired (streamable_http + stdio).
# A Conf save of these (or of openapi_servers) applies at the NEXT chat turn, or at once with the
# rediscover button; a generic settings PUT carrying the list does not trigger rediscovery.
mcp_servers:
  - name: web-tools
    transport: streamable_http   # streamable_http | stdio
    url: http://192.168.1.160:3003/mcp
    # headers: { Authorization: "Bearer …" }   # optional, for an authenticated server
    risk: med                    # low | med | high
    enabled: true
    connect_timeout_s: 10        # bounds discovery + each call's handshake
    # call_timeout_s: 120        # per-call deadline; unset → connect_timeout_s
  # A stdio (local subprocess) server:
  # - name: filesystem
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
  #   env: {}                    # the subprocess environment (secret-looking names are masked in the API)
  #   risk: high

# The fleet, keyed by host name (the live wol_server_win.py `computers{}` shape — copy yours in).
# Each host's id is a slug of its name (so RENAMING a host changes its id and its services' ids).
# ssh_password is a secret: masked on API read, never logged. Every field but `ip` is optional, and what
# you omit disables that capability without an error — the buttons still render, and pressing one the
# host can't do answers with a refusal ("no MAC configured …", "no SSH credentials configured …"). SSH
# is PASSWORD auth only (no keys / ssh-agent), and the same password is fed to `sudo`. Edit hosts in
# Conf → Computers (the generic settings PUT refuses `computers`) or here by hand.
computers:
  pegasus:
    ip: 192.168.1.10
    mac: "00:11:22:33:44:55"
    ssh_username: nengo
    ssh_password: changeme
    ssh_port: 22
    os_type: linux
    role: nas              # label on the host card + the agent's fleet roster line
    # vpn_host: pegasus      # D47: MagicDNS name (preferred) or overlay IP — SSH failover + service links
    #                        # when you browse over Tailscale; never pinged, probed or woken
    # ssh_prefer_vpn: false  # true → try vpn_host before ip for SSH
    # wake_on_connect: true  # D2-B — WOL this box when you open the dashboard (needs the mac above)
    # wake_on_presence: true # D2-A — WOL when one of your devices ARRIVES (needs mac + monitor.enabled)
    # wake_presence_cooldown_s: 600  # per-host override of wake.presence_cooldown_s (0 = no cooldown)
    # tags: []               # INERT (ISS-95): stored, read by nothing
    # appearance: { frontier: { x: 0.4, y: 0.6 } }  # per-theme presentation blob; the theme owns its keys
    # Services nest under their host (Phase 3). Each gets a stable id "<host-slug>.<svc-slug>".
    # Liveness is DERIVED, not stored: the `port` is TCP-probed each poll (a port-less service
    # just tracks its host being up). The svc-row links to http://<ip>:<port><path> when online.
    # `cmd` holds the per-OS start/stop/restart commands — only the host's os_type variant runs;
    # they are what the agent's start_service / stop_service / restart_service tools (and the services
    # API) run — there is NO service button in the Fleet view. A missing one yields a clean
    # "no <action> command configured" (DENIED) instead of an error.
    services:
      jellyfin:
        kind: jellyfin
        port: 8096
        # autostart: false    # INERT (ISS-95): stored (Conf shows a switch), read by nothing
        cmd:
          start:   {linux: "sudo systemctl start jellyfin"}
          stop:    {linux: "sudo systemctl stop jellyfin"}
          restart: {linux: "sudo systemctl restart jellyfin"}
      syncthing:
        port: 8384          # no cmd → status + URL only; the agent's service tools answer DENIED
  atlas:
    ip: 192.168.1.12
    mac: "6c:0b:84:ad:e1:0f"
    ssh_username: admin
    ssh_password: changeme
    ssh_port: 22
    os_type: windows
    services:
      plex:
        kind: plex
        port: 32400
        path: /web         # opens http://192.168.1.12:32400/web
        cmd:
          start:   {windows: "net start PlexService"}
          stop:    {windows: "net stop PlexService"}
          restart: {windows: "net stop PlexService & net start PlexService"}
  mercury:
    ip: 192.168.1.15
    mac: "b8:27:eb:0a:9c:21"
    ssh_username: media
    ssh_password: changeme
    os_type: windows
  vega:
    ip: 192.168.1.20
    mac: "04:7c:16:fe:88:2a"
    ssh_username: nengo
    ssh_password: changeme
    ssh_port: 2222
    os_type: linux
  titan:
    ip: 192.168.1.25
    mac: "a4:5e:60:f1:cc:13"
