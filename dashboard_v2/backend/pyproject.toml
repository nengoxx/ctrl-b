[project]
name = "ctrl-b-dashboard"
version = "0.1.0"
description = "ctrl-b dashboard_v2 — FastAPI backend for the homelab control panel"
requires-python = ">=3.11"

# Pinned baseline (RESEARCH.md §Backend). Treat as starting pins; bump deliberately.
# Phase 0 only exercises fastapi/uvicorn/pydantic(-settings)/pyyaml/aiosqlite; the rest are
# declared now so later phases (SSH, WOL, agent, voice, utils) add code, not deps.
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sse-starlette==3.4.4",
    "paramiko==5.0.0",
    "wakeonlan==3.3.0",
    "openai==2.38.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "python-multipart==0.0.29",
    "youtube-transcript-api==1.2.4",
    "beautifulsoup4==4.14.3",
    "aiosqlite==0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
