<!doctype html>
<html lang="en" data-skin="cosmos">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Chrome-Android bookmark/home-screen tiles need explicit PNG rel=icon sizes (48 + 192) — Chrome
         ignores the .ico for those tiles and falls back to a letter tile without these (Firefox reads
         the .ico, which is why the gap only showed in Chrome). PWA *install* icons stay in the
         manifest (vite.config.ts); these cover the plain-bookmark path. Generated by
         scripts/gen-pwa-icons.mjs. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS adds-to-home-screen icon (Apple ignores the PWA manifest's icons for this — so the D59
         backdrop selector, which rewrites the manifest, cannot reach this path; it is one fixed file).
         Its background is BAKED IN because iOS composites a transparent apple-touch-icon onto black
         (R28 §8) — pointing this at a transparent icon gave an accidental black tile. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Browser UI chrome color. A D51 DOCUMENTED MIRROR of the DEFAULT theme's `--bg`
         (cosmos, `src/themes/cosmos/tokens.css`) — static, like the manifest pair in vite.config.ts it
         must agree with. Deliberately NOT wired to the live skin: a theme-switch-driven theme-color is
         recorded as later polish, not built (V0 = the flip only). -->
    <meta name="theme-color" content="#0a0a0d" />
    <!-- Fonts (JetBrains Mono + Major Mono Display) are self-hosted via @fontsource, bundled by Vite
         from src/themes/vapor/vapor-fonts.css (vapor stays EAGER — D51 keeps the lazy flip for V6 — even though
         cosmos is now the default). No Google Fonts CDN → offline PWA + no third-party request /
         render-blocking <link> on first paint. -->
    <title>ctrl-b</title>
  </head>
  <body>
    <!-- No-FOUC theme bootstrap (Phase 11 / D29 §14.6). A synchronous inline script at the TOP of
         <body> (where document.body exists — <head> can't, body is null there) sets the
         palette-determining data-attrs from persisted ui state BEFORE #root paints, so first paint
         already has the right colors. `data-skin` (the @scope identity) lives on <html>; the shared
         mode/accent axes live on <body> — ONE arm for every skin since D51 V2 retired vapor's private
         `data-theme` axis. The `ui` store re-applies the full attr set when it loads (idempotent; it also
         defensively clears the retired `data-theme` attr). Mirrors store/ui.ts applyBodyAttrs +
         migrateLegacyTheme.
         The three defaults below (the static <html> stamp, this script's fallback triple, and the catch
         fallback) are the D51 DOCUMENTED-MIRROR allowlist entry for pre-JS code — they can't import
         `DEFAULT_THEME`, so they carry cosmos/dark/violet literally; move them with resolve.ts. -->
    <script>
      (function () {
        try {
          var h = document.documentElement,
            b = document.body;
          var s = JSON.parse(localStorage.getItem("ctrlb.ui") || "null");
          var theme = (s && s.theme) || "cosmos";
          var mode = (s && s.mode) || "dark";
          var accent = (s && s.accent) || "violet";
          // Legacy persisted shape: `theme` held the vapor accent (dark/aqua/ember) — those values keep
          // mapping to VAPOR (never to the new default), the twin of store/ui.ts migrateLegacyTheme.
          // They now feed the SAME shared stamping below (vapor's accent is a `data-accent` value).
          if (theme === "dark" || theme === "aqua" || theme === "ember") {
            accent = theme;
            theme = "vapor";
            mode = "dark";
          }
          h.dataset.skin = theme; // the @scope identity, on <html>
          b.dataset.mode = mode; // the shared axes — every skin, vapor included (D51 V2)
          b.dataset.accent = accent;
          // Cold-boot backdrop (D52 → GACHA_PLAN §10.5 / risk #8). A lazy theme's tokens.css lands AFTER
          // first paint, so until then the page shows the Kit's neutral base `--bg` (#1b1b1a). For gacha —
          // whose identity IS its near-black arcade night — that grey flash is loud, so its `--bg` joins
          // the D51 DOCUMENTED-MIRROR allowlist here as a pre-paint <html> background. This is a BACKDROP,
          // not a token: `.kit` paints over it the moment the shell mounts, so it can never fight the
          // cascade the way an inline `--bg` would. MOVE THIS LITERAL WITH `src/themes/gacha/tokens.css`.
          // cosmos is deliberately NOT here: its own cold-load style-in is the accepted D51 V0 trade, and
          // changing the DEFAULT theme's boot path is a separate, deliberate decision.
          var bootBg = { gacha: "#0a0b19" }[theme];
          if (bootBg) h.style.backgroundColor = bootBg;
        } catch (e) {
          /* private-mode / corrupt value — fall back to the static html[data-skin="cosmos"] */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
