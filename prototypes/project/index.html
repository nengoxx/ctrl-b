<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ctrl-b · dashboard explorations</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  .device-wrap { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .artframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  function PhoneFrame({ src, dark = true }) {
    return (
      <div className="device-wrap">
        <AndroidDevice width={412} height={892} dark={dark}>
          <iframe className="artframe" src={src} title={src} />
        </AndroidDevice>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="ctrl-b"
          title="ctrl-b · mobile dashboard"
          subtitle="Six directions, mobile-first. Each frame is a real Android-sized prototype — tap to Fleet / Agent / Settings, swap theme, wake & shutdown machines. ⤢ to focus."
        >
          <DCPostIt x={30} y={-30} rotate={-2}>
            ↓ Working Android-sized prototypes. All three have working tabs, theme toggle, and wake/shutdown actions. Open any artboard fullscreen for the real mobile experience.
          </DCPostIt>

          <DCArtboard
            id="phosphor"
            label="01 · PHOSPHOR — amber CRT, scanlines, ASCII"
            width={460}
            height={940}
          >
            <PhoneFrame src="variations/phosphor.html" dark={true} />
          </DCArtboard>

          <DCArtboard
            id="observatory"
            label="02 · OBSERVATORY — cool cyan night-sky, mono only"
            width={460}
            height={940}
          >
            <PhoneFrame src="variations/observatory.html" dark={true} />
          </DCArtboard>

          <DCArtboard
            id="vapor"
            label="03 · VAPOR — magenta + violet retrowave, neon"
            width={460}
            height={940}
          >
            <PhoneFrame src="variations/vapor.html" dark={true} />
          </DCArtboard>

          <DCArtboard
            id="minimal"
            label="04 · MINIMAL — clean rounded, quiet teal accent"
            width={460}
            height={940}
          >
            <PhoneFrame src="variations/minimal.html" dark={true} />
          </DCArtboard>

          <DCArtboard
            id="cosmos"
            label="05 · COSMOS — solar-system fleet, planets are machines"
            width={460}
            height={940}
          >
            <PhoneFrame src="variations/cosmos.html" dark={true} />
          </DCArtboard>

          <DCArtboard
            id="frontier"
            label="06 · FRONTIER — sci-fi desert, rigs staked on an illustrated map"
            width={460}
            height={940}
          >
            <PhoneFrame src="variations/frontier.html" dark={true} />
          </DCArtboard>

        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
