<style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background-color: #222c3e;
      display: grid;
      /* place-content: center; */
      margin-top: 50px;
      /* height: 100dvh; */
    }

    main {
      /* width: 400px; */
      max-width: 90%;
      height: 70vh;

      background: #000000;
      /* border: 1px solid #221b38; */
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 8px;
      margin-bottom: 16px;

      overflow-y: auto;
      scroll-behavior: smooth;
    }

    ul {
      display: flex;
      flex-direction: column;
      list-style: none;
      padding: 0;
    }

    .message {
      display: flex;
      flex-direction: column;
      margin: 4px 0;
      padding: 4px 8px;

      /* span {
        width: 36px;
        height: 36px;
        background: #eee;
        font-size: 12px;
        font-weight: 500;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 999999px;
      } */

      p {
        border-radius: 4px;
        padding: 4px 8px;
        margin-top: 4px;
      }

      &.user {
        align-self: flex-end;
        align-items: flex-end;

        span,
        p {
          background: rgb(219, 236, 255);
        }
      }

      &.bot {
        align-self: flex-start;

        span,
        p {
          background: rgb(198, 255, 220);
        }
      }
    }

    form {
      display: flex;
      margin: auto;
      margin-bottom: 30px;
      max-width: 90%;

      input {
        border-radius: 4px;
        flex-grow: 1;
        border: 0;
        padding: 8px;
        margin-right: 8px;
        border: 1px solid #ccc;
      }

      button {
        background: #09f;
        border: 0;
        color: white;
        border-radius: 4px;
        cursor: pointer;
        padding: 8px;
        transition: background .3s ease;

        &[disabled] {
          background: #ccc;
          opacity: .6;
          pointer-events: none;
        }

        &:hover {
          background: rgb(0, 104, 173);
        }
      }
    }

    small {
      font-size: 10px;
      color: #555;
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      margin: auto;
      width: 400px;
    }


  </style>

  <script type="module">

    const $ = el => document.querySelector(el)

    // I put a $ symbol in front of the variable
    // to indicate that it is a DOM element
    const $form = $('form')
    const $input = $('input')
    const $template = $('#message-template')
    const $messages = $('ul')
    const $container = $('main')
    const $button = $('button')
    const $info = $('small')
    const $loading = $('.loading')

    let messages = []
    let end = false

    //const SELECTED_MODEL = 'Llama-3-8B-Instruct-q4f32_1-MLC-1k'

    // $loading?.parentNode?.removeChild($loading)
    // $button.removeAttribute('disabled')
    // addMessage("Hi!", 'bot')
    // $input.focus()

    $form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const messageText = $input.value.trim();

        if (messageText !== '') {
            $input.value = '';
            addMessage(messageText, 'user');
            $button.setAttribute('disabled', '');

            try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                'Content-Type': 'application/json',
                },
                body: JSON.stringify({ instruction: messageText }),
            });

            if (!response.ok) throw new Error('Failed to fetch response from the server.');

            const data = await response.json();
            const reply = data.command;
            addMessage(reply, 'bot');
            } catch (error) {
            console.error('Error:', error);
            addMessage('Error: Unable to fetch response. Please try again.', 'bot');
            } finally {
            $button.removeAttribute('disabled');
            $container.scrollTop = $container.scrollHeight;
            }
        }
        });

        function addMessage(text, sender) {
        // Target the chat-specific message list
        const $messages = document.querySelector('#chat-container main ul'); 

        if (!$messages) {
            console.error('Chat container or message list not found.');
            return;
        }

        // Clone the message template
        const clonedTemplate = $template.content.cloneNode(true);
        const $newMessage = clonedTemplate.querySelector('.message');

        // Set sender and message content
        //const $who = $newMessage.querySelector('span');
        const $text = $newMessage.querySelector('p');

        //$who.textContent = sender === 'bot' ? 'Bot' : 'You';
        $text.textContent = text;
        $newMessage.classList.add(sender);

        // Append the message to the correct container
        $messages.appendChild($newMessage);

        // Scroll to the bottom of the chat container
        $messages.parentNode.scrollTop = $messages.parentNode.scrollHeight;

        return $text;
        }

  </script>


<div id="chat-container" class="container-fluid">
    <main class="container-fluid bg-dark">
      <ul></ul>
    </main>
  
    <form>
      <input class="form-control form-control-lg bg-secondary text-white border-0" placeholder="Write your message...">
      <button class="btn btn-dark btn-custom btn-lg">Send</button>
    </form>
  
    <small>&nbsp;</small>
  
    <template id="message-template">
      <li class="message">
        <span class="who"></span>
        <p class="text"></p>
      </li>
    </template>
</div>
